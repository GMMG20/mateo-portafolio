<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RiskQuest Go · Industrias Aurora</title>
<style>
/* RiskQuest Go — aventura de gestión de riesgos para todo público, de cero conocimiento al ciclo completo.
   Un solo archivo: el mundo se dibuja en <canvas>; los textos y botones son HTML encima. */
*{box-sizing:border-box;margin:0;padding:0;}
:root{--u:3px; --azul:#1c2f7a; --azul2:#0d1747; --borde:#e9eeff; --oro:#ffd166; --txt:#ffffff; --sombra:#060b24; --verde:#3fa34d; --amarillo:#e0a800; --rojo:#d0342c;}
html,body{height:100%;background:#0a0e1f;color:var(--txt);}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:100vh;padding:8px;
  font-family:"Segoe UI","Trebuchet MS",Verdana,system-ui,sans-serif;user-select:none;-webkit-user-select:none;}
/* El tamaño exacto de #juego lo calcula ajustar(): ocupa toda la ventana y, en pantallas anchas, el lienzo crece de 320 a 384 px de ancho */
#juego{position:relative;width:320px;height:192px;flex:none;background:#000;box-shadow:0 0 0 2px #1d2550,0 12px 40px rgba(0,0,0,.6);overflow:hidden;}
body.pc{padding:0;gap:0;background:#000;} body.pc #juego{box-shadow:none;}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block;cursor:pointer;}
#ui{position:absolute;inset:0;pointer-events:none;font-size:calc(var(--u)*7.6);line-height:1.3;}
#ui > *{pointer-events:auto;}
[hidden]{display:none!important;}
.centro{text-align:center;} .grande{font-size:1.5em;font-weight:800;}

/* Cajas estilo JRPG */
.caja{background:linear-gradient(180deg,var(--azul),var(--azul2));border:calc(var(--u)*1.2) solid var(--borde);border-radius:calc(var(--u)*3);
  box-shadow:0 0 0 calc(var(--u)*0.8) var(--sombra), inset 0 0 0 calc(var(--u)*0.8) #5d74c9;color:var(--txt);text-shadow:calc(var(--u)*.4) calc(var(--u)*.4) 0 #000;}
.titulo-caja{color:var(--oro);font-weight:700;}

/* Diálogo */
#dlg{position:absolute;left:3%;right:3%;bottom:3%;min-height:31%;padding:calc(var(--u)*4.5) calc(var(--u)*6);display:flex;gap:calc(var(--u)*5);align-items:flex-start;z-index:5;cursor:pointer;}
#dlg canvas{width:calc(var(--u)*40);height:calc(var(--u)*40);image-rendering:pixelated;flex:none;background:#0b1440;border:calc(var(--u)*.8) solid #8fa3e6;border-radius:calc(var(--u)*2);}
#dlg .cuerpo{flex:1;min-width:0;}
#dlg .nom{color:var(--oro);font-weight:700;margin-bottom:calc(var(--u)*1.2);font-size:.85em;}
#dlg .txt{white-space:pre-wrap;min-height:3.2em;}
#dlg .mas{position:absolute;right:calc(var(--u)*5);bottom:calc(var(--u)*2.5);color:var(--oro);font-size:.75em;animation:parpadeo 1s steps(2) infinite;}
@keyframes parpadeo{50%{opacity:.25;}}
@keyframes latido{50%{transform:scale(1.12);}}

/* Botones grandes, navegables con teclado, ratón y toque */
.lista{display:grid;gap:calc(var(--u)*2);}
.op{display:block;width:100%;text-align:left;font:inherit;font-size:.94em;color:inherit;background:rgba(255,255,255,.07);border:calc(var(--u)*.6) solid rgba(255,255,255,.25);
  padding:calc(var(--u)*2.2) calc(var(--u)*4) calc(var(--u)*2.2) calc(var(--u)*9);position:relative;cursor:pointer;text-shadow:inherit;border-radius:calc(var(--u)*2.5);}
.op.sel{background:rgba(255,209,102,.2);border-color:var(--oro);}
.op.sel::before{content:"▶";position:absolute;left:calc(var(--u)*3);color:var(--oro);}
.op[disabled]{opacity:.42;cursor:default;}
.op.mal{text-decoration:line-through;background:rgba(208,52,44,.18);}
.op.pista{grid-column:1/-1;font-size:.78em;padding-top:calc(var(--u)*1.2);padding-bottom:calc(var(--u)*1.2);border-style:dashed;background:rgba(127,211,255,.08);}
.op small{display:block;font-size:.8em;opacity:.85;font-weight:400;}

/* Capa genérica: las capas se apilan en la misma celda; un submenú tapa al menú que lo abrió, y este se oculta */
#ui #capa{position:absolute;inset:0;display:grid;grid-template:100%/100%;place-items:center;pointer-events:none;}
#capa > *{pointer-events:auto;grid-area:1/1;}
#capa > .panel:has(~ .panel){visibility:hidden;}
#capa:empty{display:none;}
.panel{position:relative;z-index:3;padding:calc(var(--u)*5) calc(var(--u)*7);max-width:94%;max-height:94%;overflow:auto;}
.panel h2{font-size:1.1em;color:var(--oro);margin-bottom:calc(var(--u)*2.5);}
.panel p{margin-bottom:calc(var(--u)*2.5);}
.panel .lista{margin-top:calc(var(--u)*1);}
.ayuda{font-size:.75em;opacity:.8;margin-top:calc(var(--u)*3);}
.toast{position:absolute;left:50%;top:5%;transform:translateX(-50%);padding:calc(var(--u)*2.2) calc(var(--u)*6);font-size:.82em;pointer-events:none;z-index:6;white-space:nowrap;}

/* Pantalla de título */
.titulo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*4);
  background:radial-gradient(ellipse at 50% 35%,#2a3f9e 0%,#101a4d 55%,#070b22 100%);}
.logo{font-family:"Lucida Console",Consolas,monospace;font-size:calc(var(--u)*22);font-weight:900;letter-spacing:.06em;color:#ffd166;line-height:1;
  text-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 #b5402f, calc(var(--u)*3) calc(var(--u)*3) 0 #000;}
.insignia{display:inline-block;margin-left:calc(var(--u)*3);padding:calc(var(--u)*.6) calc(var(--u)*3.5);font-size:calc(var(--u)*13);font-weight:900;letter-spacing:.08em;vertical-align:middle;
  background:#2fae6b;color:#fff;border-radius:calc(var(--u)*2);transform:rotate(-6deg);text-shadow:calc(var(--u)*.5) calc(var(--u)*.5) 0 #000;box-shadow:0 0 0 calc(var(--u)*.8) #000;}
.sublogo{color:#cfe0ff;letter-spacing:.1em;font-size:.72em;text-align:center;}
.titulo .lista{min-width:46%;gap:calc(var(--u)*1.4);}
.titulo .op{padding-top:calc(var(--u)*1.6);padding-bottom:calc(var(--u)*1.6);}
.titulo .panel{padding:calc(var(--u)*3.5) calc(var(--u)*5);}

/* HUD del mapa: piso, estrellas y objetivo */
#hud{position:absolute;left:2%;top:3%;padding:calc(var(--u)*2.2) calc(var(--u)*4);font-size:.78em;max-width:64%;transition:opacity .2s;}
#hud .fila{display:flex;justify-content:space-between;gap:calc(var(--u)*5);}
#hud .tema{font-size:.86em;opacity:.85;font-style:italic;}
#hud .obj{margin-top:calc(var(--u)*1.2);color:#fff3b0;font-weight:600;}
.est{color:var(--oro);font-weight:700;white-space:nowrap;}
.btn-menu{font:inherit;font-size:.92em;color:#fff;background:#3b4f9e;border:calc(var(--u)*.5) solid #8fa3e6;border-radius:calc(var(--u)*1.5);padding:0 calc(var(--u)*2.2);cursor:pointer;margin-left:calc(var(--u)*2);text-shadow:none;}

/* Retos */
.carta-reto{position:absolute;left:3%;top:4%;width:52%;padding:calc(var(--u)*2.5) calc(var(--u)*4);font-size:.8em;}
.carta-reto .fila{display:flex;justify-content:space-between;align-items:center;gap:calc(var(--u)*3);}
.panel-reto{position:absolute;left:3%;right:3%;bottom:3%;height:52%;padding:calc(var(--u)*3.5) calc(var(--u)*5);overflow:auto;display:flex;flex-direction:column;gap:calc(var(--u)*2);}
.panel-reto .preg{font-weight:700;}
.panel-reto .msg{flex:1;}
.panel-reto .msg.bien{color:#d9ffe0;}
.panel-reto .seguir{font-size:.72em;opacity:.75;text-align:right;}
.puntos{display:flex;gap:calc(var(--u)*1.2);margin:calc(var(--u)*1.5) 0;}
.puntos i{width:calc(var(--u)*3.6);height:calc(var(--u)*3.6);border-radius:50%;background:#3a4682;border:calc(var(--u)*.5) solid #8fa3e6;}
.puntos i.ok{background:var(--oro);border-color:var(--oro);}
.puntos i.ahora{background:#fff;animation:latido 1s infinite;}
.chip{display:inline-block;padding:0 calc(var(--u)*2);border-radius:calc(var(--u)*1.2);font-weight:700;color:#fff;text-shadow:calc(var(--u)*.4) calc(var(--u)*.4) 0 rgba(0,0,0,.6);font-size:.9em;}
.estrellas{color:var(--oro);letter-spacing:.12em;font-size:1.7em;text-align:center;line-height:1.2;}
.frase-lista{font-size:1.02em;line-height:1.5;}
.frase-lista .cau{color:#9fe1ff;} .frase-lista .eve{color:#ffd166;} .frase-lista .con{color:#ffb0a8;}

/* Semáforo de 3×3: filas = probabilidad, columnas = impacto */
.semaforo{display:inline-grid;grid-template-columns:auto auto;align-items:center;gap:calc(var(--u)*1);font-size:.6em;margin-top:calc(var(--u)*1);}
.semaforo .rejilla{display:grid;grid-template-columns:auto repeat(3,calc(var(--u)*11));grid-auto-rows:calc(var(--u)*7.5);gap:calc(var(--u)*.8);}
.semaforo.grande{font-size:.72em;margin:calc(var(--u)*1.5) 0;}
.semaforo.grande .rejilla{grid-template-columns:auto repeat(3,calc(var(--u)*27));grid-auto-rows:calc(var(--u)*11);}
.semaforo .et{display:flex;align-items:center;justify-content:center;text-align:center;opacity:.85;padding:0 calc(var(--u)*1);}
.semaforo .cel{border-radius:calc(var(--u)*1.2);display:flex;align-items:center;justify-content:center;border:calc(var(--u)*.5) solid rgba(0,0,0,.3);color:#fff;font-weight:900;}
.semaforo .cel.sel{outline:calc(var(--u)*1) solid #fff;outline-offset:calc(var(--u)*.2);animation:latido 1s infinite;}
.semaforo .eje-y{writing-mode:vertical-rl;transform:rotate(180deg);opacity:.75;}
.semaforo .eje-x{grid-column:2;text-align:center;opacity:.75;}

/* Prácticas */
.carta-grande{font-size:1.08em;font-weight:700;text-align:center;padding:calc(var(--u)*4) calc(var(--u)*5);margin:calc(var(--u)*1) 0 calc(var(--u)*3);
  background:rgba(255,255,255,.08);border-radius:calc(var(--u)*3);border:calc(var(--u)*.6) dashed rgba(255,255,255,.4);}
.frase{font-size:1em;line-height:2;margin-bottom:calc(var(--u)*2.5);}
.hueco{display:inline;padding:calc(var(--u)*.5) calc(var(--u)*2);border-bottom:calc(var(--u)*.8) dashed var(--oro);color:var(--oro);}
.hueco.lleno{border-bottom-style:solid;color:#fff;background:rgba(255,209,102,.18);border-radius:calc(var(--u)*1);}
.hueco.actual{animation:parpadeo 1.2s steps(2) infinite;}
.vigia{text-align:center;}
.vigia .ind-nombre{font-weight:700;color:#cfe0ff;}
.vigia .valor{font-size:2.3em;font-weight:800;line-height:1.1;}
.vigia .regla{position:relative;height:calc(var(--u)*9);border-radius:calc(var(--u)*2);overflow:hidden;display:flex;margin:calc(var(--u)*2) 0 calc(var(--u)*3);border:calc(var(--u)*.6) solid #000;}
.vigia .regla span{display:flex;align-items:center;justify-content:center;font-size:.62em;color:#fff;font-weight:800;}
.vigia .aguja{position:absolute;top:0;bottom:0;width:calc(var(--u)*1.6);margin-left:calc(var(--u)*-.8);background:#fff;box-shadow:0 0 0 calc(var(--u)*.6) #000;transition:left .1s linear;}
.vigia .estado{min-height:1.3em;color:#fff3b0;}
.vigia .op{text-align:center;font-size:1.15em;font-weight:800;padding-left:calc(var(--u)*4);}
.vigia .op.sel::before{content:"";}

/* Palabras de riesgo (glosario) y tarjetas */
.palabras{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*2.2);}
.palabra{background:rgba(255,255,255,.07);border-radius:calc(var(--u)*2);padding:calc(var(--u)*2) calc(var(--u)*3);font-size:.8em;border-left:calc(var(--u)*1.2) solid var(--oro);}
.palabra b{color:var(--oro);} .palabra i{display:block;font-size:.88em;opacity:.85;margin-top:calc(var(--u)*.8);}
.palabra.bloq{opacity:.45;border-left-color:#5d6782;}
.ciclo{margin:0 0 calc(var(--u)*3) calc(var(--u)*8);} .ciclo li{margin-bottom:calc(var(--u)*1.5);}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*5);}
.apariencias{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*3);margin:calc(var(--u)*2) 0 calc(var(--u)*3);}
.apariencias canvas{width:100%;image-rendering:pixelated;background:#0b1440;border-radius:calc(var(--u)*2);border:calc(var(--u)*.9) solid transparent;cursor:pointer;}
.apariencias canvas.sel{border-color:var(--oro);}
input.nombre{font:inherit;color:#fff;background:#0a0f2c;border:calc(var(--u)*.8) solid #8fa3e6;border-radius:calc(var(--u)*1.5);padding:calc(var(--u)*2) calc(var(--u)*3);width:100%;}

/* Accesibilidad: texto grande y modo para daltonismo (letras V, A y R además de colores) */
body.texto-grande #ui{font-size:calc(var(--u)*8.8);}
.sim{display:none;font-style:normal;}
body.daltonico .sim{display:inline;}
/* Modo facilitador */
.letra{display:inline-block;min-width:1.5em;text-align:center;background:var(--oro);color:#1c2f7a;border-radius:calc(var(--u)*1.2);text-shadow:none;margin-right:calc(var(--u)*1.5);font-weight:800;}
.cronometro{position:absolute;right:2%;top:3%;z-index:7;padding:calc(var(--u)*2.2) calc(var(--u)*5);font-size:.8em;pointer-events:none;}
.cronometro.fin{background:linear-gradient(180deg,#8a1f1f,#4a0f0f);}

/* Controles táctiles */
#tactil{display:none;width:960px;max-width:100%;flex:none;justify-content:space-between;align-items:center;padding:0 6px;}
body.tactil #tactil{display:flex;}
/* En horizontal basta tocar el piso para caminar: se ocultan los botones y el juego gana espacio */
@media (orientation: landscape){ body.tactil #tactil{display:none;} }
.cruz{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;}
.cruz button,.ab button{font:700 18px/1 system-ui,sans-serif;color:#fff;background:#24306b;border:2px solid #6f86d6;border-radius:12px;touch-action:none;}
.cruz .c-up{grid-column:2;grid-row:1;} .cruz .c-left{grid-column:1;grid-row:2;} .cruz .c-right{grid-column:3;grid-row:2;} .cruz .c-down{grid-column:2;grid-row:3;}
.ab{display:flex;gap:14px;} .ab button{width:64px;height:64px;border-radius:50%;}
.ab .a{background:#b5402f;} .ab .b{background:#3b4f9e;}

/* Certificado imprimible */
#certificado{display:none;}
@media print{
  body{background:#fff;color:#000;display:block;padding:0;}
  body > *:not(#certificado){display:none!important;}
  #certificado{display:block!important;font-family:Georgia,serif;text-align:center;padding:40px;border:6px double #1c2f7a;margin:30px;}
  #certificado h1{font-size:28pt;color:#1c2f7a;margin:10px 0 20px;}
  #certificado p{font-size:13pt;margin:10px 0;}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<div id="juego" aria-label="RiskQuest Go, juego de gestión de riesgos para todo público">
  <canvas id="cv" width="320" height="192"></canvas>
  <div id="ui">
    <div id="hud" class="caja" hidden></div>
    <div id="dlg" class="caja" hidden role="dialog" aria-live="polite">
      <canvas id="retrato" width="48" height="48"></canvas>
      <div class="cuerpo"><div class="nom"></div><div class="txt"></div></div>
      <span class="mas">▼ seguir</span>
    </div>
    <div id="capa"></div>
  </div>
</div>
<div id="tactil" aria-hidden="true">
  <div class="cruz">
    <button class="c-up" data-k="ArrowUp">▲</button><button class="c-left" data-k="ArrowLeft">◀</button>
    <button class="c-right" data-k="ArrowRight">▶</button><button class="c-down" data-k="ArrowDown">▼</button>
  </div>
  <div class="ab"><button class="b" data-k="Escape">B</button><button class="a" data-k="Enter">A</button></div>
</div>
<div id="certificado"></div>
<script>
/* =====================================================================
   RiskQuest Go · 1. DATOS — guardado, semáforo de 3×3, palabras de riesgo, prueba, ajustes y apariencias
   Pensado para personas que no saben nada de gestión de riesgos: una idea nueva por piso, en palabras de todos los días.
   ===================================================================== */
const VERSION = 1;
const CLAVE_GUARDADO = 'riskquest_go_v1';   // distinta de la versión completa: cada juego guarda su propia partida

// Semáforo de 3×3: probabilidad (1 baja, 2 media, 3 alta) × impacto (1 leve, 2 moderado, 3 grave)
const PROB = [null, {n:'Baja', d:'Casi nunca pasa'}, {n:'Media', d:'Pasa a veces'}, {n:'Alta', d:'Pasa muy seguido'}];
const IMP = [null, {n:'Leve', d:'Se arregla fácil'}, {n:'Moderado', d:'Causa molestias o gastos'}, {n:'Grave', d:'Daño serio a personas, dinero o clientes'}];
const COLORES = [{n:'Verde', c:'#3fa34d', s:'V'}, {n:'Amarillo', c:'#d39b00', s:'A'}, {n:'Rojo', c:'#d0342c', s:'R'}];
// probabilidad × impacto: 1–2 verde, 3–4 amarillo, 6–9 rojo
const colorDe = (p,i) => { const v = p*i; return v>=6 ? 2 : v>=3 ? 1 : 0; };

// Palabras de riesgo: se aprenden de a pocas, con una definición sencilla y un ejemplo de la vida diaria
const PALABRAS = {
  objetivo:{t:'Objetivo', i:'🎯', d:'Lo que queremos lograr.', e:'Llegar a tiempo y seco al trabajo.'},
  riesgo:{t:'Riesgo', i:'⚠️', d:'Algo que PODRÍA pasar y afectaría nuestro objetivo.', e:'Podría llover camino al trabajo.'},
  problema:{t:'Problema', i:'🔧', d:'Algo que YA pasó. El problema se resuelve; el riesgo se previene.', e:'Ya está lloviendo y no traje paraguas.'},
  causa:{t:'Causa', i:'🔍', d:'El porqué un riesgo podría pasar.', e:'El piso está mojado.'},
  consecuencia:{t:'Consecuencia', i:'💥', d:'Lo que pasaría si el riesgo ocurre.', e:'Alguien se resbala y se lastima.'},
  probabilidad:{t:'Probabilidad', i:'🎲', d:'Qué tan posible es que pase: baja, media o alta.', e:'En invierno, la probabilidad de lluvia es alta.'},
  impacto:{t:'Impacto', i:'📏', d:'Qué tan grave sería si pasa: leve, moderado o grave.', e:'Mojarse es leve; una inundación es grave.'},
  semaforo:{t:'Nivel de riesgo', i:'🚦', d:'Probabilidad e impacto juntos, como un semáforo: verde, amarillo o rojo.', e:'Muy probable y grave da rojo.'},
  priorizar:{t:'Priorizar', i:'🥇', d:'Atender primero lo más rojo, porque no se puede todo al tiempo.', e:'Primero el incendio, después la gotera.'},
  evitar:{t:'Evitar', i:'⛔', d:'No hacer la actividad que trae el riesgo.', e:'Si el río está crecido, no lo cruzas.'},
  reducir:{t:'Reducir', i:'🛡️', d:'Tomar medidas para que pase menos o haga menos daño.', e:'Usar casco en la moto.'},
  compartir:{t:'Compartir', i:'🤝', d:'Pasar parte del golpe a otro, por ejemplo con un seguro.', e:'Asegurar el carro.'},
  aceptar:{t:'Aceptar', i:'👌', d:'Asumir un riesgo pequeño y vigilarlo.', e:'Saber que se te puede perder un lápiz.'},
  apetito:{t:'Apetito de riesgo', i:'🍽️', d:'Cuánto riesgo está dispuesta a asumir la empresa. En Aurora solo se acepta lo verde.', e:'Hay quien se sube a la montaña rusa y quien no: cada uno tiene su apetito.'},
  control:{t:'Control', i:'🔒', d:'Una acción que ayuda a que el riesgo no pase o haga menos daño.', e:'Ponerle llave a la puerta.'},
  antes:{t:'Control de antes', i:'🚧', d:'Evita que el riesgo pase: baja la probabilidad. También se llama preventivo.', e:'Revisar los frenos antes del viaje.'},
  despues:{t:'Control de después', i:'🚨', d:'Avisa a tiempo o reduce el daño: baja el impacto. Se llama detectivo o correctivo.', e:'La alarma de humo y el extintor.'},
  residual:{t:'Riesgo residual', i:'🌗', d:'El riesgo que queda después de los controles. Casi nunca es cero; por eso se vigila.', e:'Con casco te puedes caer igual, pero te lastimas menos.'},
  indicador:{t:'Indicador de riesgo', i:'📈', d:'Un número que avisa ANTES de que el riesgo pase. Verde: bien; amarillo: alerta; rojo: actuar ya.', e:'La luz de la gasolina del carro.'},
  avisar:{t:'Avisar a tiempo', i:'📣', d:'Contarle a quien corresponde apenas algo se pone en amarillo, sin esperar al rojo.', e:'Avisar de la gotera antes de que se inunde.'},
  dueno:{t:'Dueño del riesgo', i:'🙋', d:'La persona que vigila el riesgo y actúa. Si es de todos, no es de nadie.', e:'Quien maneja el carro revisa la gasolina.'},
  ciclo:{t:'Ciclo de gestión de riesgos', i:'🔄', d:'Identificar, evaluar, responder, vigilar y avisar… y volver a empezar, porque los riesgos cambian.', e:'Como mirar el cielo cada mañana antes de salir.'}
};

// ---------- Flujo de cada piso ----------
function alLlegar(n, llegada){
  if(G.modo!=='mapa' || UI.tope()) return;
  const et = E.etapa[n]||0;
  if(n===1 && llegada==='inicio') decir(['Industrias Aurora · lunes, 8:00 a. m.','Hoy es tu primer día de trabajo. ¡Bienvenido!',
    gz('¡{N}! Aquí estoy, el del signo «!». Camina hasta mí y pulsa A, o tócame con el ratón o el dedo.')]);
  else if(et===0 && llegada==='asc' && LLEGADA[n]) decir([gz(LLEGADA[n])]);
}
function hablar(n){
  if(n.id==='gonzalo'){ hablarGonzalo(); return; }
  const D = DIALOGOS[n.id]; if(!D) return; const et = E.fin ? 3 : (E.etapa[E.piso]||0);
  decir(D[Math.min(et, D.length-1)].map(t=>({q:n.id, t})));
}
function hablarGonzalo(){
  const n = E.piso, et = E.etapa[n]||0;
  if(E.fin){ decir([gz('¡Gracias por jugar, {N}! Puedes recorrer los pisos cuando quieras: el ascensor te lleva a todos.')]); return; }
  if(et===0){ decir(LECCION[n], ()=>PRACTICA[n](()=>{ E.etapa[n] = 1; guardar(); hud(); decir(TRAS_PRACTICA[n]); })); return; }
  if(et===1){ const q = G.riesgos.length;
    decir([gz(q===1 ? 'Te falta un riesgo: está marcado con el signo «!».' : `Te faltan ${q} riesgos: están marcados con el signo «!».`), gz('Si dudas, en cada reto puedes pedirme una pista.')]); return; }
  if(et===2){ cierrePiso(n); return; }
  decir([gz('El ascensor ya está abierto. ¡Nos vemos arriba!')]);
}
// Repaso del piso: las palabras nuevas, las estrellas y el paso siguiente
function cierrePiso(n){
  const est = PISOS[n].retos.reduce((a,r)=>a+(E.estrellas[r.id]||0), 0) + (E.estrellas['practica'+n]||0), max = 3*(PISOS[n].retos.length+1);
  decir([gz(n===ULTIMO_PISO ? '¡Lo lograste, {N}! La Gran Tormenta está bajo control.' : '¡Lo hiciste muy bien! Repasemos lo que aprendiste en este piso.')], ()=>{
    const c = panel(`Lo que aprendiste · Piso ${n}`, `<p class="centro">★ ${est} de ${max} estrellas en este piso</p><div class="palabras">${PISOS[n].palabras.map(tarjetaPalabra).join('')}</div>`,
      [{t:'¡Entendido!', f:()=>{ UI.cerrar(c); E.etapa[n] = 3; guardar(); hud();
        if(n<ULTIMO_PISO) decir([gz(`El ascensor ya se abrió. ¡Te espero en el piso ${n+1}!`)]); else finalJuego(); }}], {ancho:'92%'});
    leer('Lo que aprendiste: ' + PISOS[n].palabras.map(id=>PALABRAS[id].t + ': ' + PALABRAS[id].d).join(' '));
  });
}
// Final: el ciclo completo, la prueba final y la pantalla de resultados
function finalJuego(){
  decir([{q:'elena', t:'¡Gracias, {N}! Hoy Aurora es una empresa más preparada.'}, gz('Todo lo que hiciste hoy forma un ciclo: el CICLO DE GESTIÓN DE RIESGOS.'), apr('ciclo')], ()=>{

      <li><b>Vigilar y avisar</b>: indicadores, dueños y avisos a tiempo.</li></ol><p>…y vuelta a empezar, porque los riesgos cambian.</p>`,
      [{t:'Continuar', f:()=>{ UI.cerrar(c); decir([gz('Una última cosa: responde otra vez las preguntas del comienzo. ¡Vas a ver cuánto aprendiste!')],
        ()=>prueba('final', ()=>{ E.fin = true; guardar(); pantallaFinal(); })); }}], {ancho:'90%'});
    leer('El ciclo de gestión de riesgos: identificar, evaluar, responder, vigilar y avisar. Y vuelta a empezar, porque los riesgos cambian.');
  });
}

    const P = L.P, st = s%16, cp = Math.floor(s/16), atraso = st%2 ? P.swing : st%4===2 ? P.swing*.6 : 0, tt = t + atraso*L.paso + (Math.random()-.5)*.008;
    if(P.kick[st]==='x') this.bombo(tt);
    if(P.snare[st]==='x') this.caja(tt);
    if(P.hat[st]==='x' || P.hat[st]==='o') this.platillo(tt, P.hat[st]==='o', (st%4===0 ? 1 : .55) * (.8+Math.random()*.3));
    if(st===0) P.prog[cp].forEach((n,k)=>this.rhodes(tt + k*.014, this.frec(n), L.paso*15, .04));
    if(P.comp && st===10) P.prog[cp].slice(1).forEach(n=>this.rhodes(tt, this.frec(n), L.paso*5, .018));
    if(st===0) this.bajo(tt, this.frec(P.bajo[cp]), L.paso*7, 1);
    if(st===10) this.bajo(tt, this.frec(P.bajo[cp])*1.5, L.paso*3, .6);
    ((P.mel||[])[cp]||[]).forEach(([s0,n,d])=>{ if(s0===st) this.rhodes(tt, this.frec(n), L.paso*d*1.6, .05, true); });
    if(Math.random()<.06) this.chasquido(t + Math.random()*L.paso);
  },
  // Piano eléctrico: seno + triángulo (o seno a la octava, si suena como campana), ataque suave y cola larga
  rhodes(t, f, dur, vol, campana){
    const c = this.ctx, o1 = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain(), g2 = c.createGain();
    o1.type = 'sine'; o2.type = campana ? 'sine' : 'triangle'; o1.frequency.value = f; o2.frequency.value = campana ? f*2 : f; o2.detune.value = 7; g2.gain.value = campana ? .22 : .32;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.012); g.gain.exponentialRampToValueAtTime(vol*.4, t+.3); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(this.bus.lofi); o1.start(t); o2.start(t); o1.stop(t+dur+.05); o2.stop(t+dur+.05);
  },
  bajo(t, f, dur, v){
    const c = this.ctx, o = c.createOscillator(), g = c.createGain(); o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.2*v, t+.02); g.gain.setValueAtTime(.2*v, t+dur*.6); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    o.connect(g); g.connect(this.bus.lofi); o.start(t); o.stop(t+dur+.05);
  },
  bombo(t){ const c = this.ctx, o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(42, t+.12);
    g.gain.setValueAtTime(.38, t); g.gain.exponentialRampToValueAtTime(.0001, t+.38); o.connect(g); g.connect(this.bus.lofi); o.start(t); o.stop(t+.4); },
  caja(t){ const c = this.ctx, n = c.createBufferSource(), bp = c.createBiquadFilter(), g = c.createGain(); n.buffer = this.ruido; bp.type = 'bandpass'; bp.frequency.value = 1700; bp.Q.value = .8;
    g.gain.setValueAtTime(.14, t); g.gain.exponentialRampToValueAtTime(.0001, t+.22); n.connect(bp); bp.connect(g); g.connect(this.bus.musica); n.start(t, Math.random()*.5); n.stop(t+.25);
    const o = c.createOscillator(), g2 = c.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(190, t); o.frequency.exponentialRampToValueAtTime(140, t+.08);
    g2.gain.setValueAtTime(.08, t); g2.gain.exponentialRampToValueAtTime(.0001, t+.12); o.connect(g2); g2.connect(this.bus.lofi); o.start(t); o.stop(t+.14); },
  platillo(t, abierto, v){ const c = this.ctx, n = c.createBufferSource(), hp = c.createBiquadFilter(), lp = c.createBiquadFilter(), g = c.createGain(); n.buffer = this.ruido;
    hp.type = 'highpass'; hp.frequency.value = 6000; lp.type = 'lowpass'; lp.frequency.value = 8000; const d = abierto ? .18 : .045;
    g.gain.setValueAtTime(.03*v, t); g.gain.exponentialRampToValueAtTime(.0001, t+d); n.connect(hp); hp.connect(lp); lp.connect(g); g.connect(this.bus.musica); n.start(t, Math.random()*.5); n.stop(t+d+.02); },
  chasquido(t){ const c = this.ctx, n = c.createBufferSource(), g = c.createGain(); n.buffer = this.ruido; g.gain.setValueAtTime(.04, t); g.gain.exponentialRampToValueAtTime(.0001, t+.006);
    n.connect(g); g.connect(this.bus.musica); n.start(t, Math.random()*.5); n.stop(t+.01); },
  // ---------- Jingles y efectos ----------
  jingle(nom, despues){
    const J = JINGLES[nom], prev = this.contexto; this.parar();
    const seguir = ()=>{ if(despues) despues(); else this.musica(prev); };
    if(!this.ctx || !J || this.estilo==='ninguna'){ setTimeout(seguir, 300); return; }
    const seg = 60/J.tempo/4, lofi = this.estilo==='lofi'; let t = this.ctx.currentTime+.05;
    this.parsear(J.n).forEach(n=>{ if(n.f){ if(lofi) this.rhodes(t, n.f, n.d*seg*2, .07, true); else this.nota(t, n.f, n.d*seg, J.tipo, J.vol); } t += n.d*seg; });
    setTimeout(seguir, (t-this.ctx.currentTime)*1000+150);
  },
  sfx(tipo){
    if(!this.ctx || !this.efectos) return; const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain(); o.connect(g); g.connect(this.bus.efectos);
    const cfg = {
      blip:['square',880,880,.015,.03], ok:['square',660,990,.05,.08], no:['square',300,180,.05,.12], paso:['triangle',120,90,.03,.03],
      golpe:['sawtooth',220,60,.07,.18], acierto:['square',523,1046,.06,.22], fallo:['triangle',260,120,.08,.25], curar:['triangle',440,880,.07,.3],
      alerta:['square',988,740,.05,.2], puerta:['triangle',196,392,.06,.25]}[tipo] || ['square',440,440,.04,.05];
    o.type = cfg[0]; o.frequency.setValueAtTime(cfg[1], t); o.frequency.exponentialRampToValueAtTime(cfg[2], t+cfg[4]);
    g.gain.setValueAtTime(cfg[3], t); g.gain.exponentialRampToValueAtTime(.0005, t+cfg[4]); o.start(t); o.stop(t+cfg[4]+.02);
  }
};
Sonido.cargar();

/* =====================================================================
   6. MOTOR — escala, capas de interfaz, listas, diálogos con lectura en voz alta, entrada (teclado, ratón y toque),
   caminar tocando el piso, objetivo del piso y guardado
   ===================================================================== */
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const conNombre = s => String(s==null?'':s).replace(/\{N\}/g, E.nombre || 'amigo');
const barajar = a => { const b = a.slice(); for(let i=b.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [b[i],b[j]] = [b[j],b[i]]; } return b; };
function nuevoEstado(){
  return {v:VERSION, nombre:'', ap:0, piso:1, x:11, y:10, dir:'arriba', pisoMax:1, etapa:{}, hechos:[], estrellas:{}, palabras:[], pre:null, post:null, fin:false,
    stats:{aciertos:0, intentos:0, ayudas:0, tiempo:0}, porConcepto:{}};
}
let E = nuevoEstado();
const G = {modo:'titulo', t:0, npcs:[], riesgos:[], jug:null, cam:{x:0,y:0}, teclas:new Set(), fade:0, fadeObj:0, fadeFn:null, reto:null, ruta:null};

// ---------- Escala: el juego ocupa toda la ventana. Alto fijo de 192 px; el ancho (ANCHO) va de 320 a 384 según la pantalla ----------
let ANCHO = 320;
const ALTO = 192;
function pantallaCompleta(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function ajustar(){
  const pc = pantallaCompleta(), margen = pc ? 0 : 16, tactil = $('tactil').offsetHeight ? $('tactil').offsetHeight + 10 : 0;   // 0 si los botones táctiles están ocultos
  // clientWidth/clientHeight y no innerWidth: en celulares innerWidth crece si algo se desborda y el cálculo se realimentaría
  const de = document.documentElement, W = Math.max(280, de.clientWidth-margen), H = Math.max(168, de.clientHeight-margen-tactil);
  const ancho = Math.max(320, Math.min(384, Math.round(ALTO*W/H/2)*2));
  if(ancho!==ANCHO || cv.width!==ancho){ ANCHO = ancho; cv.width = ancho; cv.height = ALTO; ctx.imageSmoothingEnabled = false; }
  const s = Math.min(W/ANCHO, H/ALTO), j = $('juego');
  j.style.width = Math.floor(ANCHO*s)+'px'; j.style.height = Math.floor(ALTO*s)+'px'; j.style.setProperty('--u', s+'px');
  $('tactil').style.width = Math.floor(ANCHO*s)+'px';
  document.body.classList.toggle('pc', pc);
}
function alternarPantallaCompleta(){
  const d = document, el = d.documentElement, aviso = 'El navegador no permitió la pantalla completa' + (document.body.classList.contains('tactil') ? '' : ': prueba con F11');
  try{
    if(pantallaCompleta()){ (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
    const p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    if(p && p.catch) p.catch(()=>toast(aviso));
  }catch(e){ toast(aviso); }
}
if(matchMedia('(pointer: coarse)').matches) document.body.classList.add('tactil');
window.addEventListener('resize', ajustar);
document.addEventListener('fullscreenchange', ajustar); document.addEventListener('webkitfullscreenchange', ajustar);
ajustar(); requestAnimationFrame(ajustar);   // segunda pasada, por si al cargar había barras de desplazamiento

// ---------- Lectura en voz alta (opcional): usa las voces en español instaladas en el equipo, sin internet ----------
const limpiarVoz = t => conNombre(t).replace(/<[^>]+>/g,' ').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}★☆▶▼●○✔✘]/gu,'').replace(/[«»*]/g,'').replace(/\s+/g,' ').trim();
const Voz = {
  ok: 'speechSynthesis' in window,
  voz(){ const vs = speechSynthesis.getVoices(); return vs.find(v=>/^es[-_](CO|MX|US|419)/i.test(v.lang)) || vs.find(v=>/^es/i.test(v.lang)) || null; },
  descripcion(){ if(!this.ok) return 'Este navegador no tiene voz'; const v = this.voz(); return v ? 'Voz: ' + v.name : 'No hay voz en español instalada: puede sonar con otro acento'; },
  leer(t){ if(!AJ.voz || !this.ok) return; try{ speechSynthesis.cancel(); const txt = limpiarVoz(t); if(!txt) return; const u = new SpeechSynthesisUtterance(txt), v = this.voz();
    u.lang = v ? v.lang : 'es-ES'; if(v) u.voice = v; u.rate = .95; speechSynthesis.speak(u); }catch(e){} },
  callar(){ if(this.ok) try{ speechSynthesis.cancel(); }catch(e){} }
};
const leer = t => Voz.leer(t);

// ---------- Capas de interfaz ----------
const UI = {
  pila:[],
  abrir(el, onKey, opts={}){ $('capa').appendChild(el); const c = {el, onKey, opts}; this.pila.push(c); return c; },
  cerrar(c){ const k = c ? this.pila.indexOf(c) : this.pila.length-1; if(k<0) return; const [x] = this.pila.splice(k,1); x.el.remove(); if(x.opts.alCerrar) x.opts.alCerrar(); },
  tope(){ return this.pila[this.pila.length-1]; },
  vaciar(){ while(this.pila.length) this.cerrar(); }
};
function div(cls, html){ const d = document.createElement('div'); if(cls) d.className = cls; if(html!=null) d.innerHTML = html; return d; }
// Lista de botones grandes, navegable con teclado, ratón y toque. items: {t, sub, dis, f, cls, sinLetra}
function lista(items, {cols=1, cancel=null, alMover=null, inicial=0, decision=false}={}){
  const el = div('lista'); el.style.gridTemplateColumns = `repeat(${cols},1fr)`;
  const voto = decision && AJ.facilitador;
  let sel = Math.max(0, Math.min(inicial, items.length-1)), letra = 0;
  const botones = items.map((it,k)=>{ const b = document.createElement('button'); b.className = 'op' + (it.cls ? ' '+it.cls : ''); b.type = 'button';
    b.innerHTML = (voto && !it.sinLetra ? `<b class="letra">${'ABCDEFGH'[letra++]}</b> ` : '') + esc(it.t) + (it.sub ? `<small>${esc(it.sub)}</small>` : ''); if(it.dis) b.disabled = true;
    // stopPropagation: el clic no debe llegar al panel de abajo (que, al cambiar de contenido, lo tomaría como «seguir»)
    b.onmouseenter = ()=>{ if(!it.dis){ sel = k; pintar(); } }; b.onclick = e=>{ e.stopPropagation(); if(!it.dis){ sel = k; elegir(); } }; el.appendChild(b); return b; });
  const pintar = ()=>{ botones.forEach((b,k)=>b.classList.toggle('sel', k===sel)); if(botones[sel] && botones[sel].isConnected) botones[sel].scrollIntoView({block:'nearest'}); if(alMover) alMover(items[sel], sel); };
  const mover = d=>{ let n = sel; for(let i=0;i<items.length;i++){ n = (n+d+items.length)%items.length; if(!items[n].dis) break; } if(n!==sel){ sel = n; Sonido.sfx('blip'); pintar(); } };
  const elegir = ()=>{ const it = items[sel]; if(!it || it.dis) { Sonido.sfx('no'); return; } Sonido.sfx('ok'); it.f && it.f(it, sel); };
  if(items[sel] && items[sel].dis) mover(1);
  pintar(); if(voto) cronometro(el);
  return {el, onKey(k){
    if(k==='arriba') mover(-cols); else if(k==='abajo') mover(cols); else if(k==='izquierda' && cols>1) mover(-1); else if(k==='derecha' && cols>1) mover(1);
    else if(k==='A') elegir(); else if(k==='B' && cancel){ Sonido.sfx('no'); cancel(); } }};
}
// Panel con título, cuerpo HTML y botones
function panel(titulo, html, items, opts={}){
  const el = div('caja panel'); el.innerHTML = (titulo ? `<h2>${titulo}</h2>` : '') + (html||'');
  let L = null; if(items){ L = lista(items, opts); el.appendChild(L.el); }
  if(opts.ayuda) el.appendChild(div('ayuda', opts.ayuda));
  if(opts.ancho) el.style.width = opts.ancho;
  // Con un solo botón y texto largo, las flechas desplazan el panel (para quien juega solo con teclado)
  const capa = UI.abrir(el, k=>{
    if((k==='arriba'||k==='abajo') && (!items || items.length<=1) && el.scrollHeight > el.clientHeight+2){ el.scrollBy({top:(k==='abajo' ? 1 : -1)*el.clientHeight*.45, behavior:'smooth'}); return; }
    if(L) L.onKey(k); else if((k==='A'||k==='B') && opts.cancel) opts.cancel(); }, opts);
  return capa;
}
let tToast = null;
function toast(msg){ document.querySelectorAll('.toast').forEach(t=>t.remove()); const t = div('caja toast', esc(msg)); $('ui').appendChild(t); clearTimeout(tToast); tToast = setTimeout(()=>t.remove(), 2400); }

// ---------- Diálogos con efecto de escritura (y voz, si está activada) ----------
// pasos: 'texto' | {q:'gonzalo'|'jugador'|id de persona, t:'texto', e:'feliz'|'pensativo'|'preocupado'} | {fn:()=>{}}
const Dlg = {
  cola:[], activo:false, txt:'', i:0, timer:null, fin:null, capa:null, L:null,
  decir(pasos, fin){ this.cola = pasos.slice(); this.fin = fin||null; this.activo = true; $('dlg').hidden = false;
    this.capa = UI.abrir(div(null,''), k=>this.tecla(k)); this.siguiente(); },
  siguiente(){
    clearInterval(this.timer); const box = $('dlg');
    if(!this.cola.length){ this.cerrar(); return; }
    const p = this.cola.shift();
    if(typeof p==='object' && p.fn){ p.fn(); if(this.activo) this.siguiente(); return; }
    const q = typeof p==='string' ? null : p.q, t = conNombre(typeof p==='string' ? p : p.t||'');
    const ap = q==='jugador' ? AP_JUGADOR[E.ap] : (q && AP[q]) ? AP[q] : null;
    $('retrato').hidden = !ap; if(ap) retrato($('retrato').getContext('2d'), ap, q==='jugador' ? 'jug'+E.ap : q, p.e || (q==='gonzalo' ? 'feliz' : null));
    box.querySelector('.nom').textContent = q==='jugador' ? (E.nombre||'Tú') : q ? (NOMBRES[q] || q) : '';
    this.txt = t; this.i = 0; const el = box.querySelector('.txt'); el.textContent = '';
    box.querySelector('.mas').hidden = true; leer(t);
    const v = velTexto(); if(!v){ this.listo(); return; }
    this.timer = setInterval(()=>{ this.i += v; el.textContent = this.txt.slice(0,this.i); if(this.i % 6 < v) Sonido.sfx('blip');
      if(this.i>=this.txt.length){ clearInterval(this.timer); this.timer = null; this.listo(); } }, 22);
  },
  listo(){ const box = $('dlg'); box.querySelector('.txt').textContent = this.txt; box.querySelector('.mas').hidden = false; },
  tecla(k){
    if(this.timer){ if(k==='A'||k==='B'){ clearInterval(this.timer); this.timer = null; this.listo(); } return; }
    if(k==='A'||k==='B'){ Sonido.sfx('blip'); this.siguiente(); }
  },
  cerrar(){ clearInterval(this.timer); this.activo = false; $('dlg').hidden = true; Voz.callar(); if(this.capa) UI.cerrar(this.capa); this.capa = null;
    const f = this.fin; this.fin = null; if(f) f(); }
};
const decir = (pasos, fin) => Dlg.decir(pasos, fin);

// ---------- Entrada: teclado, botones táctiles, ratón y toque ----------
const TECLAS = {ArrowUp:'arriba', w:'arriba', W:'arriba', ArrowDown:'abajo', s:'abajo', S:'abajo', ArrowLeft:'izquierda', a:'izquierda', A:'izquierda',
  ArrowRight:'derecha', d:'derecha', D:'derecha', Enter:'A', ' ':'A', z:'A', Z:'A', Escape:'B', x:'B', X:'B', Backspace:'B'};
const DIRS = {arriba:[0,-1], abajo:[0,1], izquierda:[-1,0], derecha:[1,0]};
const OPUESTO = {arriba:'abajo', abajo:'arriba', izquierda:'derecha', derecha:'izquierda'};
function teclaAbajo(key){
  Sonido.desbloquear();
  const k = TECLAS[key]; if(!k) return false;
  if(DIRS[k]){ G.teclas.add(k); G.ruta = null; }
  const top = UI.tope(); if(top){ top.onKey(k); return true; }
  if(G.modo==='mapa'){ if(k==='A') interactuar(); else if(k==='B') menuPausa(); else girarHacia(k); }
  return true;
}
function teclaArriba(key){ const k = TECLAS[key]; if(k) G.teclas.delete(k); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT' && e.key!=='Enter' && e.key!=='Escape') return; if(e.repeat && UI.tope()) return;
  if(!e.ctrlKey && !e.metaKey && !e.altKey && !e.repeat){   // F: pantalla completa · M: música sí/no
    if(e.key==='f' || e.key==='F'){ e.preventDefault(); alternarPantallaCompleta(); return; }
    if(e.key==='m' || e.key==='M'){ e.preventDefault(); Sonido.desbloquear(); const n = Sonido.alternarMusica();
      if(G.modo==='titulo' && UI.pila.length===1) pantallaTitulo(2); toast('Música: '+n); return; } }
  if(teclaAbajo(e.key)) e.preventDefault(); });
document.addEventListener('keyup', e=>teclaArriba(e.key));
document.addEventListener('pointerdown', ()=>Sonido.desbloquear());   // con ratón o dedo también arranca el audio
document.querySelectorAll('#tactil button').forEach(b=>{ const k = b.dataset.k;
  b.addEventListener('pointerdown', e=>{ e.preventDefault(); teclaAbajo(k); }); ['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t, ()=>teclaArriba(k))); });
window.addEventListener('blur', ()=>G.teclas.clear());
// Tocar o hacer clic en el mapa: el personaje camina hasta allí; si es una persona, un riesgo o un objeto, llega a su lado y lo usa
cv.addEventListener('click', e=>{
  if(G.modo!=='mapa' || !G.jug) return;
  if(UI.tope()){ if(Dlg.activo) Dlg.tecla('A'); return; }
  const r = cv.getBoundingClientRect(), X = (e.clientX-r.left)/r.width*ANCHO + G.cam.x, Y = (e.clientY-r.top)/r.height*ALTO + G.cam.y;
  irA(Math.floor(X/TS), Math.floor(Y/TS));
});

// ---------- Mundo ----------
const pisoAct = () => PISOS[E.piso];
const tileEn = (x,y) => { const m = pisoAct().mapa; return (y<0||y>=m.length||x<0||x>=m[0].length) ? '#' : m[y][x]; };
const npcEn = (x,y) => G.npcs.find(n=>n.x===x && n.y===y);
const riesgoEn = (x,y) => G.riesgos.find(r=>r.x===x && r.y===y);
const libre = (x,y) => CAMINABLE.has(tileEn(x,y)) && !npcEn(x,y) && !riesgoEn(x,y);
const INTERACTIVO = new Set(['E','P','k','w','D','d','r','t','b','m','s','x','V','g']);
// Ruta más corta por casillas libres (búsqueda en anchura). Devuelve los pasos sin incluir el inicio, [] si ya está en la meta, o null
function buscarRuta(x0, y0, esMeta){
  if(esMeta(x0,y0)) return [];
  const M = pisoAct().mapa, W = M[0].length, H = M.length, prev = new Map(), clave = (x,y)=>y*W+x, cola = [[x0,y0]]; prev.set(clave(x0,y0), null);
  while(cola.length){ const [x,y] = cola.shift();
    for(const [dx,dy] of Object.values(DIRS)){ const nx = x+dx, ny = y+dy, k = clave(nx,ny);
      if(nx<0||ny<0||nx>=W||ny>=H || prev.has(k) || !libre(nx,ny)) continue;
      prev.set(k, [x,y]);
      if(esMeta(nx,ny)){ const ruta = [[nx,ny]]; let p = [x,y]; while(p && !(p[0]===x0 && p[1]===y0)){ ruta.unshift(p); p = prev.get(clave(p[0],p[1])); } return ruta; }
      cola.push([nx,ny]); } }
  return null;
}
function irA(tx, ty){
  const j = G.jug; if(!j) return;
  const destino = npcEn(tx,ty) || riesgoEn(tx,ty) || INTERACTIVO.has(tileEn(tx,ty));
  if(!destino){ if(!CAMINABLE.has(tileEn(tx,ty))) return; const ruta = buscarRuta(j.x, j.y, (x,y)=>x===tx && y===ty); if(ruta) G.ruta = {pasos:ruta, alLlegar:null}; return; }
  // casillas desde donde se puede usar el destino: al lado, o al otro lado de un mostrador o escritorio
  const metas = [];
  for(const [d,[dx,dy]] of Object.entries(DIRS)){
    metas.push({x:tx-dx, y:ty-dy, dir:d});
    if(MOSTRADOR.has(tileEn(tx-dx, ty-dy)) && npcEn(tx,ty)) metas.push({x:tx-2*dx, y:ty-2*dy, dir:d}); }
  const esMeta = (x,y)=>metas.some(m=>m.x===x && m.y===y);
  const ruta = buscarRuta(j.x, j.y, esMeta); if(!ruta) return;
  const fin = ruta.length ? ruta[ruta.length-1] : [j.x, j.y], m = metas.find(m=>m.x===fin[0] && m.y===fin[1]);
  G.ruta = {pasos:ruta, alLlegar:()=>{ G.jug.dir = m.dir; interactuar(); }};
}
function cargarPiso(n, llegada){
  E.piso = n; E.pisoMax = Math.max(E.pisoMax, n); const P = PISOS[n];
  G.npcs = P.npcs.map(o=>Object.assign({}, o));
  G.riesgos = P.retos.filter(r=>!E.hechos.includes(r.id)).map(r=>Object.assign({}, r));
  if(llegada==='asc'){ E.x = P.asc.x; E.y = P.asc.y+1; E.dir = 'abajo'; }
  else if(llegada==='inicio'){ E.x = P.inicio.x; E.y = P.inicio.y; E.dir = P.inicio.dir; }
  G.jug = {x:E.x, y:E.y, px:E.x*TS, py:E.y*TS, dir:E.dir, f:0, mov:null}; G.ruta = null;
  G.modo = 'mapa'; Sonido.musica('mapa'); hud(); guardar();
  setTimeout(()=>alLlegar(n, llegada), 350);
}
function girarHacia(k){ const j = G.jug; if(j && !j.mov) j.dir = k; }
function frente(){ const j = G.jug, [dx,dy] = DIRS[j.dir]; return [j.x+dx, j.y+dy]; }
const OBJETOS = {b:'Archivadores llenos de carpetas.', m:'Una máquina de la planta. Zumba sin parar.', s:'Los servidores zumban y parpadean.', x:'Cajas con productos de Aurora, listas para despachar.',
  V:'Una caja fuerte, bien cerrada.', g:'Un sofá cómodo para los visitantes.', w:'Agua fresca. ¡Hay que hidratarse!', k:'Un café recién hecho. Tranquilo: la partida se guarda sola.', D:'Es la puerta de la calle. Tu aventura está adentro.'};
function interactuar(){
  const j = G.jug; if(!j || j.mov) return; const [fx,fy] = frente();
  const r = riesgoEn(fx,fy); if(r){ encuentro(r); return; }
  let n = npcEn(fx,fy); const ch = tileEn(fx,fy);
  if(!n && MOSTRADOR.has(ch)){ const [dx,dy] = DIRS[j.dir]; n = npcEn(fx+dx, fy+dy); }
  if(n){ n.dir = OPUESTO[j.dir]; hablar(n); return; }
  if(ch==='E'){ ascensor(); return; }
  if(ch==='P'){ pizarra(); return; }
  if(OBJETOS[ch]){ decir([OBJETOS[ch]]); return; }
  if(ch==='d'||ch==='r'||ch==='t'){ const L = pisoAct().escritorio; decir([L[(fx+fy)%L.length]]); }
}
function encuentro(r){
  const et = E.etapa[E.piso]||0;
  if(et===0){ decir([{q:'gonzalo', t:'¡Espera, {N}! Antes de enfrentar ese riesgo, ven a hablar conmigo. Te explico cómo hacerlo.', e:'preocupado'}]); return; }
  Sonido.sfx('alerta');
  iniciarReto(r.id, ()=>{
    if(!E.hechos.includes(r.id)) E.hechos.push(r.id);
    G.riesgos = G.riesgos.filter(x=>x.id!==r.id);
    if(!G.riesgos.length){ E.etapa[E.piso] = 2; guardar(); hud();
      decir([{q:'gonzalo', t: E.piso===ULTIMO_PISO ? '¡Increíble, {N}! La Gran Tormenta está bajo control. Ven conmigo.' : '¡Excelente! Ya no quedan riesgos sueltos en este piso. Ven conmigo para repasar lo aprendido.'}]); }
    else { guardar(); hud(); }
  });
}

const RESPUESTAS = [{n:'Evitar', i:'⛔', d:'No hacer la actividad'},{n:'Reducir', i:'🛡️', d:'Tomar medidas'},{n:'Compartir', i:'🤝', d:'Seguro o contrato'},{n:'Aceptar', i:'👌', d:'Asumirlo y vigilarlo'}];

const PISTAS_TIPO = {
  prob:'Fíjate en qué tan seguido pasa: casi nunca es baja; a veces, media; muy seguido, alta.',
  imp:'Piensa en el daño: si se arregla fácil es leve; si causa molestias o gastos, moderado; si lastima a alguien o cuesta mucho, grave.',
  respuesta:'Evitar es no hacerlo; reducir, tomar medidas; compartir, pasar parte del golpe a otro (como un seguro); aceptar, asumir algo pequeño.'};
const chip = c => `<span class="chip" style="background:${COLORES[c].c}">${COLORES[c].n}<span class="sim"> (${COLORES[c].s})</span></span>`;
// Semáforo de 3×3 con la casilla elegida resaltada
function semaforoHTML(p, i, grande){
  let h = `<div class="semaforo${grande ? ' grande' : ''}"><div class="eje-y">Probabilidad</div><div class="rejilla">`;
  for(let y=3;y>=1;y--){ h += `<div class="et">${PROB[y].n}</div>`;
    for(let x=1;x<=3;x++){ const c = colorDe(y,x); h += `<div class="cel${y===p && x===i ? ' sel' : ''}" style="background:${COLORES[c].c}"><span class="sim">${COLORES[c].s}</span></div>`; } }
  h += '<div></div>' + [1,2,3].map(x=>`<div class="et">${grande ? IMP[x].n : ['Leve','Mod.','Grave'][x-1]}</div>`).join('') + '</div><div></div><div class="eje-x">Impacto</div></div>';
  return h;

function iniciarReto(id, alTerminar){
  if(G.reto && G.reto.capa) UI.cerrar(G.reto.capa);
  const r = RIESGOS[id];
  const C = G.reto = {id, r, k:0, p:r.p||null, i:r.i||null, errores:0, ayudas:0, descartadas:new Set(), pistaPaso:false, alTerminar,
    anim:{golpe:0, temblor:0, entrada:1, flash:0, calma:0}, fx:null, tecla:null, capa:null};
  C.color = C.p && C.i ? colorDe(C.p, C.i) : null;

  const el = div(null, '<div id="rCarta" class="caja carta-reto"></div><div id="rPanel" class="caja panel-reto"></div>');

// Ficha del riesgo: nombre, avance del reto y, cuando se conoce, su color en el semáforo
function carta(){
  const C = G.reto; if(!C) return; const r = C.r;
  const puntos = r.pasos.map((_,k)=>`<i class="${k<C.k ? 'ok' : k===C.k && C.anim.calma===0 ? 'ahora' : ''}"></i>`).join('');
  $('rCarta').innerHTML = `<div class="fila"><b>${esc(r.nombre)}</b>${C.color!=null ? chip(C.color) : ''}</div><div class="puntos" title="Avance del reto">${puntos}</div>
    ${C.p && C.i ? semaforoHTML(C.p, C.i) : ''}`;
}
// Mensajes del reto: se avanzan con A, clic o toque. Cada línea es texto o {html, voz}
function mensajeReto(lineas, fin, clase){
  const C = G.reto; if(!C) return; const pan = $('rPanel'); let k = 0;
  const mostrar = ()=>{ const L = lineas[k], html = typeof L==='object' ? L.html : esc(conNombre(L)), voz = typeof L==='object' ? (L.voz||'') : L;
    pan.innerHTML = `<div class="msg ${clase||''}">${html}</div><div class="seguir">▶ Toca o pulsa A para seguir</div>`; leer(voz); };
  C.tecla = key=>{ if(key!=='A' && key!=='B') return; Sonido.sfx('blip'); k++; if(k<lineas.length) mostrar(); else { C.tecla = null; pan.onclick = null; fin && fin(); } };
  pan.onclick = ()=>C.tecla && C.tecla('A');
  mostrar();

// Pregunta con botones grandes; la pista de Gonzalo cuesta una estrella
function preguntar(texto, ops, esCorrecta, alAcertar, opts={}){
  const C = G.reto; if(!C) return; const pan = $('rPanel'); pan.onclick = null;
  pan.innerHTML = `<div class="preg">${esc(conNombre(texto))}</div>`;
  const items = ops.map((o,i)=>({t:o.t, sub:o.sub, dis:C.descartadas.has(i), cls:C.descartadas.has(i) ? 'mal' : '', f:()=>responder(i)}));
  if(!C.pistaPaso && opts.pista) items.push({t:'💡 Pedir una pista a Gonzalo', cls:'pista', sinLetra:true, f:()=>{ C.pistaPaso = true; C.ayudas++; E.stats.ayudas++;
    decir([{q:'gonzalo', t:opts.pista, e:'pensativo'}], ()=>preguntar(texto, ops, esCorrecta, alAcertar, opts)); }});
  const L = lista(items, {cols: ops.length===4 ? 2 : 1, decision:true, inicial: Math.max(0, items.findIndex(it=>!it.dis))});
  pan.appendChild(L.el); C.tecla = k=>L.onKey(k);
  leer(texto + ' ' + ops.filter((o,i)=>!C.descartadas.has(i)).map(o=>o.t).join('. '));
  function responder(i){
    const ok = esCorrecta(i); registrar(ok, opts.c);

    Sonido.sfx('fallo'); C.errores++; C.descartadas.add(i); C.anim.temblor = 1; C.fx = {tipo:'golpe', t:0};
    const exp = opts.mal ? (Array.isArray(opts.mal) ? opts.mal[i] : opts.mal) : null;
    decir([{q:'gonzalo', t:'¡Casi! ' + (exp || opts.pista || 'Piénsalo otra vez.'), e:'pensativo'}], ()=>preguntar(texto, ops, esCorrecta, alAcertar, opts));
  }
}
function paso(){
  const C = G.reto; if(!C) return; const r = C.r;
  if(C.k>=r.pasos.length){ ganarReto(); return; }
  carta();
  const P = r.pasos[C.k], pista = P.pista || PISTAS_TIPO[P.tipo];
  const seguir = lineas=>{ C.k++; carta(); mensajeReto(lineas, paso, 'bien'); };
  const semaforoLinea = (txt, voz)=>({html:`${txt}<div class="centro">${semaforoHTML(C.p, C.i, true)}</div>`, voz});
  if(P.tipo==='elige' || P.tipo==='control'){
    preguntar(P.p, P.ops.map(t=>({t})), i=>i===P.ok, ()=>{
      const L = ['✔ ' + (P.bien || '¡Bien!')];
      if(P.tipo==='control' && C.p && C.i){ const antes = C.color;
        if(P.momento==='antes') C.p = Math.max(1, C.p-1); else C.i = Math.max(1, C.i-1);
        C.color = colorDe(C.p, C.i);
        L.push(semaforoLinea(`${P.momento==='antes' ? 'Baja la <b>probabilidad</b>' : 'Baja el <b>impacto</b>'}: el riesgo pasa de ${chip(antes)} a ${chip(C.color)}.`,
          `El riesgo pasa de ${COLORES[antes].n} a ${COLORES[C.color].n}.`)); }
      seguir(L); }, {pista, c:P.c, mal:P.mal, fx: P.tipo==='control' ? 'escudo' : 'acierto'});
  }
  else if(P.tipo==='prob'){
    preguntar(P.p + ' ¿Qué tan PROBABLE es?', [1,2,3].map(v=>({t:PROB[v].n, sub:PROB[v].d})), i=>i+1===P.ok, ()=>{ C.p = P.ok;
      seguir(['✔ ' + (P.bien || `Probabilidad ${PROB[P.ok].n.toLowerCase()}: ${PROB[P.ok].d.toLowerCase()}.`)]); }, {pista, c:'probabilidad', fx:'evaluar'});
  }
  else if(P.tipo==='imp'){
    preguntar(P.p + ' ¿Qué tan GRAVE sería?', [1,2,3].map(v=>({t:IMP[v].n, sub:IMP[v].d})), i=>i+1===P.ok, ()=>{ C.i = P.ok;
      const L = ['✔ ' + (P.bien || `Impacto ${IMP[P.ok].n.toLowerCase()}: ${IMP[P.ok].d.toLowerCase()}.`)];
      if(C.p){ C.color = colorDe(C.p, C.i);
        L.push(semaforoLinea(`Probabilidad <b>${PROB[C.p].n}</b> + impacto <b>${IMP[C.i].n}</b> = ${chip(C.color)}`, `Probabilidad ${PROB[C.p].n} e impacto ${IMP[C.i].n}: nivel ${COLORES[C.color].n}.`)); }
      seguir(L); }, {pista, c:'impacto', fx:'evaluar'});
  }
  else if(P.tipo==='prioridad'){
    preguntar(`El riesgo quedó en ${COLORES[C.color].n.toLowerCase()}. Entonces, ¿cuándo lo atendemos?`, ATENCION.map(a=>({t:a.t})), i=>ATENCION[i].c===C.color,
      ()=>seguir(['✔ ' + PRIORIDAD_BIEN[C.color]]), {pista:'Rojo: primero. Amarillo: pronto. Verde: puede esperar, pero se vigila.', c:'priorizar', fx:'evaluar'});
  }
  else if(P.tipo==='respuesta'){
    preguntar(P.p, RESPUESTAS.map((x,k)=>({t:`${x.i} ${x.n}`, sub:(P.subs && P.subs[k]) || x.d})), i=>i===P.ok, ()=>seguir(['✔ ' + P.bien]), {pista, c:P.c || 'respuestas', mal:P.mal, fx:'respuesta'});
  }
  else if(P.tipo==='frase'){
    seguir([{html:`<div class="frase-lista">Riesgo completo: Por <b class="cau">${esc(P.causa)}</b>, podría pasar que <b class="eve">${esc(P.evento)}</b>, y eso causaría <b class="con">${esc(P.cons)}</b>.</div>`,
      voz:`Riesgo completo: por ${P.causa}, podría pasar que ${P.evento}, y eso causaría ${P.cons}.`}]);
  }
}
function ganarReto(){
  const C = G.reto, r = C.r, est = Math.max(1, 3 - C.errores - (C.ayudas ? 1 : 0));

// Panel de respuesta: ✔ o ✘ con la explicación, y un botón para seguir
function retro(ok, html, voz, sig, boton='Siguiente'){
  Sonido.sfx(ok ? 'acierto' : 'fallo');
  const f = panel(ok ? '✔ ¡Bien!' : '✘ Casi', html, [{t:boton, f:()=>{ UI.cerrar(f); sig(); }}], {ancho:'80%'});
  leer((ok ? 'Bien. ' : 'Casi. ') + voz);
}
// Clasificar tarjetas en dos o cuatro grupos (riesgo o problema, las cuatro respuestas, antes o después)
function clasificar({titulo, intro, cartas, cats, concepto, clave, fin}){
  const mazo = barajar(cartas); let k = 0, bien = 0;
  const sig = ()=>{
    if(k>=mazo.length){ resultadoPractica(clave, bien, mazo.length, fin); return; }
    const ca = mazo[k];
    const capa = panel(`${titulo} · ${k+1} de ${mazo.length}`, (intro ? `<p>${esc(intro)}</p>` : '') + `<div class="carta-grande">${esc(ca.t)}</div>`,
      cats.map((c,i)=>({t:c.t, sub:c.sub, f:()=>{ UI.cerrar(capa); const ok = i===ca.ok; registrar(ok, concepto); if(ok) bien++;
        retro(ok, (ok ? '' : `<p>Era: <b>${esc(cats[ca.ok].t)}</b></p>`) + `<p>${esc(ca.exp)}</p>`, (ok ? '' : `Era ${cats[ca.ok].t}. `) + ca.exp, ()=>{ k++; sig(); }); }})),
      {ancho:'92%', cols: cats.length>2 ? 2 : cats.length, decision:true});
    leer((intro ? intro + ' ' : '') + ca.t);
  };
  sig();
}
// Armar la frase de un riesgo: «Por [causa], podría pasar que [riesgo], y eso causaría [consecuencia]»
const PARTES = [{k:'causa', n:'la causa', et:'Por…', c:'causa'},{k:'evento', n:'el riesgo', et:'podría pasar que…', c:'riesgo'},{k:'cons', n:'la consecuencia', et:'y eso causaría…', c:'consecuencia'}];
const AYUDA_PARTE = ['La causa es el porqué.','El riesgo es lo que podría pasar.','La consecuencia es lo que pasaría después.'];
function armarFrase({rondas, clave, fin}){
  let r = 0, bien = 0, total = 0;
  const ronda = ()=>{
    if(r>=rondas.length){ resultadoPractica(clave, bien, total, fin); return; }
    const R = rondas[r], puestos = [null,null,null]; let s = 0;
    const hueco = j=>`<span class="hueco${puestos[j] ? ' lleno' : j===s ? ' actual' : ''}">${puestos[j] ? esc(puestos[j]) : '……'}</span>`;
    const fraseHTML = ()=>`<div class="frase">Por ${hueco(0)}, podría pasar que ${hueco(1)}, y eso causaría ${hueco(2)}.</div>`;
    const titulo = `Arma la frase · ${r+1} de ${rondas.length}`;
    const pedir = ()=>{
      if(s===2){ puestos[2] = R.cons; s = 3; }   // la última pieza cae sola en su lugar
      if(s>=3){ Sonido.sfx('acierto');
        const c = panel(titulo, fraseHTML() + '<p class="centro">✔ ¡Frase completa! Así se cuenta un riesgo.</p>', [{t:'Continuar', f:()=>{ UI.cerrar(c); r++; ronda(); }}], {ancho:'92%'});
        leer(`Frase completa: por ${R.causa}, podría pasar que ${R.evento}, y eso causaría ${R.cons}.`); return; }
      const libres = barajar([0,1,2].filter(j=>!puestos[j]));
      const capa = panel(titulo, fraseHTML() + `<p>¿Qué va en «${PARTES[s].et}»? Busca <b>${PARTES[s].n}</b>.</p>`,
        libres.map(j=>({t:R[PARTES[j].k], f:()=>{ UI.cerrar(capa); total++; const ok = j===s; registrar(ok, PARTES[s].c);
          if(ok){ bien++; Sonido.sfx('acierto'); puestos[s] = R[PARTES[s].k]; s++; pedir(); }
          else { Sonido.sfx('fallo'); decir([{q:'gonzalo', t:`¡Casi! «${R[PARTES[j].k]}» es ${PARTES[j].n}, no ${PARTES[s].n}. ${AYUDA_PARTE[s]}`, e:'pensativo'}], pedir); } }})),
        {ancho:'92%', decision:true});
      leer(`¿Qué va en ${PARTES[s].et}? Busca ${PARTES[s].n}. Opciones: ` + libres.map(j=>R[PARTES[j].k]).join('. '));
    };
    pedir();
  };
  ronda();
}
// El semáforo: calificar probabilidad e impacto de tres riesgos de la casa y elegir cuál va primero
function semaforoPractica({casos, clave, fin}){
  let k = 0, bien = 0, total = 0;
  const elegir = (titulo, html, ops, correcta, concepto, exp, sig, voz)=>{
    const capa = panel(titulo, html, ops.map((o,i)=>({t:o.t, sub:o.sub, f:()=>{ UI.cerrar(capa); total++; const ok = i===correcta; registrar(ok, concepto); if(ok) bien++;
      retro(ok, `<p>${ok ? '' : `Era <b>${esc(ops[correcta].t)}</b>. `}${esc(exp)}</p>`, (ok ? '' : `Era ${ops[correcta].t}. `) + exp, sig); }})), {ancho:'92%', decision:true});
    leer(voz);
  };
  const caso = ()=>{
    if(k>=casos.length){ prioridad(); return; }
    const S = casos[k], tit = `El semáforo · ${k+1} de ${casos.length}`, cab = `<div class="carta-grande">${esc(S.t)}</div>`;
    elegir(tit, cab + `<p>${esc(S.pp)}</p><p><b>¿Qué tan PROBABLE es?</b></p>`, [1,2,3].map(v=>({t:PROB[v].n, sub:PROB[v].d})), S.p-1, 'probabilidad', S.expP, ()=>
      elegir(tit, cab + `<p>${esc(S.ip)}</p><p><b>Si pasa, ¿qué tan GRAVE sería?</b></p>`, [1,2,3].map(v=>({t:IMP[v].n, sub:IMP[v].d})), S.i-1, 'impacto', S.expI, ()=>{
        const c = colorDe(S.p, S.i); Sonido.sfx('ok');
        const f = panel(tit, cab + `<p class="centro">Probabilidad <b>${PROB[S.p].n}</b> + impacto <b>${IMP[S.i].n}</b> = ${chip(c)}</p><div class="centro">${semaforoHTML(S.p, S.i, true)}</div>`,
          [{t:'Siguiente', f:()=>{ UI.cerrar(f); k++; caso(); }}], {ancho:'86%'});
        leer(`${S.t}: probabilidad ${PROB[S.p].n} e impacto ${IMP[S.i].n}. Queda en ${COLORES[c].n}.`); }, `${S.ip} Si pasa, ¿qué tan grave sería?`),
      `${S.t}. ${S.pp} ¿Qué tan probable es?`);
  };
  const prioridad = ()=>{
    const roja = casos.findIndex(c=>colorDe(c.p,c.i)===2);
    elegir('¿Cuál va primero?', '<p>Ya calificaste los tres. Si hoy solo puedes atender uno, ¿cuál eliges?</p>', casos.map(c=>({t:c.t, sub:COLORES[colorDe(c.p,c.i)].n})), roja, 'priorizar',
      'Primero lo rojo: es lo más probable y grave a la vez. Eso es priorizar.', ()=>resultadoPractica(clave, bien, total, fin), 'Si hoy solo puedes atender uno, ¿cuál eliges?');
  };
  caso();
}
// El vigía: un indicador cambia en vivo; hay que avisar cuando se pone amarillo (ni antes, ni después). Luego, ¿quién es el dueño?
function vigia({rondas, dueno, clave, fin}){
  let r = 0, bien = 0, total = 0;
  const ronda = ()=>{
    if(r>=rondas.length){ preguntaDueno(); return; }
    const R = rondas[r]; let t = 0, terminado = false;
    const valor = s=>{ const P = R.puntos; if(s>=P[P.length-1][0]) return P[P.length-1][1];
      for(let i=1;i<P.length;i++) if(s<=P[i][0]){ const [t0,v0] = P[i-1], [t1,v1] = P[i]; return v0 + (v1-v0)*(s-t0)/(t1-t0); } return P[0][1]; };
    const zona = v=>R.sube ? (v>=R.rojo ? 2 : v>=R.amarillo ? 1 : 0) : (v<=R.rojo ? 2 : v<=R.amarillo ? 1 : 0);
    const pct = v=>Math.max(0, Math.min(100, (v-R.min)/(R.max-R.min)*100));
    // bandas de la regla, de izquierda (mínimo) a derecha (máximo)
    const bandas = R.sube ? [[R.min,R.amarillo,0],[R.amarillo,R.rojo,1],[R.rojo,R.max,2]] : [[R.min,R.rojo,2],[R.rojo,R.amarillo,1],[R.amarillo,R.max,0]];
    const regla = bandas.map(([a,b,c])=>`<span style="width:${pct(b)-pct(a)}%;background:${COLORES[c].c}">${COLORES[c].n}</span>`).join('');
    const el = div('caja panel vigia'); el.style.width = '90%';
    el.innerHTML = `<h2>El vigía · ${r+1} de ${rondas.length}</h2><p>${esc(R.intro)}</p><div class="ind-nombre">📈 ${esc(R.n)}</div><div class="valor">${Math.round(R.puntos[0][1])}</div>
      <div class="regla">${regla}<div class="aguja" style="left:${pct(R.puntos[0][1])}%"></div></div><p class="estado"></p>`;
    const L = lista([{t:'📣 ¡Avisar!', f:()=>avisar()}]); el.appendChild(L.el);
    const capa = UI.abrir(el, k=>L.onKey(k));
    leer(R.intro);
    let enPausa = 0;
    const tick = setInterval(()=>{
      if(terminado || !el.isConnected){ clearInterval(tick); return; }
      if(UI.tope()!==capa){ enPausa++; return; }   // si hay un menú encima, el tiempo se detiene
      t += .1; const v = Math.round(valor(t)); el.querySelector('.valor').textContent = v; el.querySelector('.valor').style.color = ['#9ff0b0','#ffe08a','#ff9b8f'][zona(v)];
      el.querySelector('.aguja').style.left = pct(v) + '%';
      if(zona(v)===2) terminar(false);
    }, 100);
    function avisar(){
      if(terminado) return; const v = Math.round(valor(t)), z = zona(v);
      if(z===0){ total++; registrar(false, 'avisar'); Sonido.sfx('no'); const m = 'Todavía está en verde: es pronto para avisar. ¡Sigue mirando!'; el.querySelector('.estado').textContent = m; leer(m); return; }
      terminar(z===1);
    }
    function terminar(ok){
      terminado = true; clearInterval(tick); total++; registrar(ok, 'avisar'); if(ok) bien++;
      UI.cerrar(capa); retro(ok, `<p>${esc(ok ? R.bien : R.tarde)}</p>`, ok ? R.bien : R.tarde, ()=>{ r++; ronda(); });
    }
  };
  const preguntaDueno = ()=>{
    const Q = dueno;
    const capa = panel('¿Quién es el dueño?', `<p><b>${esc(Q.p)}</b></p>`, Q.ops.map((o,i)=>({t:o, f:()=>{ UI.cerrar(capa); total++; const ok = i===Q.ok; registrar(ok, 'dueno'); if(ok) bien++;
      retro(ok, (ok ? '' : `<p>Era: <b>${esc(Q.ops[Q.ok])}</b></p>`) + `<p>${esc(Q.exp)}</p>`, Q.exp, ()=>resultadoPractica(clave, bien, total, fin)); }})), {ancho:'90%', decision:true});
    leer(Q.p + ' ' + Q.ops.join('. '));
  };
  ronda();
}
// Prueba inicial y final: las mismas 5 preguntas; «Todavía no lo sé» siempre es válido
function prueba(tipo, fin){
  const ini = tipo==='inicial', nom = ini ? '¿Qué sabes hoy?' : 'Prueba final';
  const intro = ini ? 'Antes de empezar, 5 preguntas rápidas. Si no sabes la respuesta, elige «Todavía no lo sé»: ¡es normal! Al final verás cuánto aprendiste.'
                    : 'Las mismas 5 preguntas del comienzo. ¡Veamos cuánto aprendiste!';
  const c = panel(nom, `<p>${intro}</p>`, [{t:'Empezar', f:()=>{ UI.cerrar(c); let k = 0, bien = 0; const res = [];
    const sig = ()=>{
      if(k>=PRUEBA.length){ E[ini ? 'pre' : 'post'] = {bien, total:PRUEBA.length, res}; guardar();
        if(ini){ fin(); return; }
        const pre = E.pre ? E.pre.bien : null, msj = pre==null ? '¡Buen trabajo!' : bien>pre ? `Al comienzo acertaste ${pre}. ¡Aprendiste mucho!` : bien===PRUEBA.length ? '¡Perfecto!' : `Al comienzo acertaste ${pre}. ¡Buen trabajo!`;
        const f = panel('Resultado de la prueba final', `<p class="centro grande">${bien} de ${PRUEBA.length}</p><p class="centro">${msj}</p>`, [{t:'Continuar', f:()=>{ UI.cerrar(f); fin(); }}], {ancho:'72%'});
        leer(`Acertaste ${bien} de ${PRUEBA.length}. ${msj}`); return; }
      const Q = PRUEBA[k], ops = Q.ops.concat(['🤔 Todavía no lo sé']);
      const capa = panel(`${nom} · ${k+1} de ${PRUEBA.length}`, `<p><b>${esc(Q.p)}</b></p>`, ops.map((o,i)=>({t:o, f:()=>{ UI.cerrar(capa); const ok = i===Q.ok; res.push(ok); if(ok) bien++; k++; sig(); }})), {ancho:'92%'});
      leer(Q.p + ' ' + ops.join('. '));
    };
    sig(); }}], {ancho:'82%'});
  leer(intro);
}
// Resultados en CSV (separador «;» y BOM para que Excel respete las tildes)
function exportarResultados(){
  const f = (a)=>a.map(x=>{ const s = String(x==null?'':x); return /[;"\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; }).join(';');
  const filas = [['RiskQuest Go · resultados'],['Nombre', E.nombre],['Fecha', new Date().toLocaleString('es-CO')],['Tiempo de juego', tiempoTxt(E.stats.tiempo)],
    ['Piso alcanzado', E.pisoMax + ' de ' + ULTIMO_PISO],['Aventura completa', E.fin ? 'Sí' : 'No'],['Estrellas', totalEstrellas() + ' de ' + maxEstrellas()],
    ['Prueba inicial', E.pre ? E.pre.bien + ' de ' + E.pre.total : '—'],['Prueba final', E.post ? E.post.bien + ' de ' + E.post.total : '—'],
    ['Respuestas correctas', E.stats.aciertos + ' de ' + E.stats.intentos],['Pistas pedidas', E.stats.ayudas],['Palabras aprendidas', E.palabras.length + ' de ' + Object.keys(PALABRAS).length],
    [],['Piso','Actividad','Estrellas']];
  Object.keys(PISOS).forEach(n=>{ filas.push([n, 'Práctica · ' + PISOS[n].tema, E.estrellas['practica'+n]||0]); PISOS[n].retos.forEach(r=>filas.push([n, 'Reto · ' + RIESGOS[r.id].nombre, E.estrellas[r.id]||0])); });
  filas.push([], ['Concepto','Aciertos','Intentos']);
  Object.entries(E.porConcepto).forEach(([c,[a,t]])=>filas.push([PALABRAS[c] ? PALABRAS[c].t : c, a, t]));
  descargar(`RiskQuest_Go_${nombreArchivo()}.csv`, '﻿' + filas.map(f).join('\r\n'), 'text/csv;charset=utf-8');
  toast('Resultados descargados');
}

    {t:`Leer en voz alta: ${AJ.voz ? 'sí' : 'no'}`, sub: Voz.descripcion(), dis:!Voz.ok, f:(it,k)=>{ AJ.voz = !AJ.voz; guardarAjustes(); re(k); if(AJ.voz) leer('Listo: leeré los textos en voz alta.'); else Voz.callar(); }},

    {t:`Música: ${ESTILOS[Sonido.estilo].n}`, sub:`Efectos ${Sonido.efectos ? 'sí' : 'no'} · volumen ${Math.round(Sonido.vol*100)} %`, f:(it,k)=>{ UI.cerrar(c); menuSonido(0, ()=>menuAjustes(k)); }},
    {t:`Tamaño del texto: ${AJ.texto==='grande' ? 'grande' : 'normal'}`, f:(it,k)=>{ AJ.texto = AJ.texto==='grande' ? 'normal' : 'grande'; guardarAjustes(); re(k); }},
    {t:`Velocidad del texto: ${{normal:'normal', rapida:'rápida', instantanea:'instantánea'}[AJ.vel]}`, f:(it,k)=>{ AJ.vel = {normal:'rapida', rapida:'instantanea', instantanea:'normal'}[AJ.vel]; guardarAjustes(); re(k); }},
    {t:`Modo para daltonismo: ${AJ.daltonico ? 'sí' : 'no'}`, sub:'Letras V, A y R además de colores', f:(it,k)=>{ AJ.daltonico = !AJ.daltonico; guardarAjustes(); re(k); }},
    {t:`Modo facilitador: ${AJ.facilitador ? 'sí' : 'no'}`, f:(it,k)=>{ AJ.facilitador = !AJ.facilitador; guardarAjustes(); re(k); }},
    {t:`Tiempo de votación: ${AJ.tiempo} s`, dis:!AJ.facilitador, f:(it,k)=>{ AJ.tiempo = AJ.tiempo===30 ? 60 : AJ.tiempo===60 ? 90 : 30; guardarAjustes(); re(k); }},
    {t:'Volver', f:()=>UI.cerrar(c)}], {cancel:()=>UI.cerrar(c), ancho:'94%', cols:2, inicial:sel});
}
// Música: cuatro estilos (lo-fi + 8 bits, solo lo-fi, solo 8 bits, sin música), efectos aparte y volumen
function menuSonido(sel=0, volver){
  const re = k=>{ UI.cerrar(c); menuSonido(k, volver); }, salir = ()=>{ UI.cerrar(c); if(volver) volver(); };
  const c = panel('Música y sonido', '<p style="font-size:.85em">Todo se genera en el navegador, sin archivos ni internet. La tecla M apaga o enciende la música en cualquier momento.</p>', [
    ...ORDEN_ESTILOS.map(e=>({t:ESTILOS[e].n + (Sonido.estilo===e ? ' ✓' : ''), sub:ESTILOS[e].d, f:(it,k)=>{ Sonido.cambiarEstilo(e); re(k); }})),
    {t:`Efectos de sonido: ${Sonido.efectos ? 'sí' : 'no'}`, f:(it,k)=>{ Sonido.efectos = !Sonido.efectos; Sonido.aplicarVol(); Sonido.guardar(); Sonido.sfx('ok'); re(k); }},
    {t:`Volumen: ${Math.round(Sonido.vol*100)} %`, sub:'Enter para subir; después del 100 % vuelve al 25 %', f:(it,k)=>{ Sonido.subirVolumen(); Sonido.sfx('ok'); re(k); }},
    {t:'Volver', f:salir}], {cancel:salir, ancho:'94%', cols:2, inicial:sel});
}
// ---------- Final ----------
function pantallaFinal(){
  UI.vaciar(); $('dlg').hidden = true; G.modo = 'final'; hud(); Sonido.musica('titulo');
  const est = totalEstrellas(), max = maxEstrellas(), pct = est/max, med = pct>=.85 ? ['🥇','Oro'] : pct>=.65 ? ['🥈','Plata'] : ['🥉','Bronce'];
  const el = div('caja panel'); el.style.width = '94%';
  el.innerHTML = `<h2>¡Felicitaciones, ${esc(E.nombre)}!</h2>
    <p>Recorriste los seis pisos de Industrias Aurora y aprendiste a gestionar riesgos de principio a fin.</p>
    <div class="dos"><div><p class="centro grande">${med[0]} Medalla de ${med[1]}</p><p class="centro">★ ${est} de ${max} estrellas</p>
      <p>Prueba inicial: <b>${E.pre ? E.pre.bien : '—'} de 5</b> · Prueba final: <b>${E.post ? E.post.bien : '—'} de 5</b><br>Tiempo: ${tiempoTxt(E.stats.tiempo)} · Pistas: ${E.stats.ayudas}</p></div>
      <div><p><b>Tus ${E.palabras.length} palabras de riesgo:</b></p><p style="font-size:.78em">${E.palabras.map(id=>PALABRAS[id].t).join(' · ')}</p></div></div>`;
  const L = lista([{t:'🖨️ Imprimir certificado', f:imprimirCertificado},{t:'📄 Descargar resultados', f:exportarResultados},{t:'🚶 Seguir explorando', f:()=>{ UI.vaciar(); cargarPiso(E.piso); }},{t:'🏠 Volver al título', f:()=>pantallaTitulo()}], {cols:2});
  el.appendChild(L.el); UI.abrir(el, k=>L.onKey(k));
  Sonido.jingle('victoria', ()=>Sonido.musica('titulo'));
  leer(`¡Felicitaciones, ${E.nombre}! Ganaste la medalla de ${med[1]}, con ${est} de ${max} estrellas.`);
}
function imprimirCertificado(){
  const est = totalEstrellas(), max = maxEstrellas(), pct = est/max, med = pct>=.85 ? 'Oro' : pct>=.65 ? 'Plata' : 'Bronce';
  const hoy = new Date().toLocaleDateString('es-CO', {day:'numeric', month:'long', year:'numeric'});
  $('certificado').innerHTML = `<p>RiskQuest Go · Industrias Aurora</p><h1>Certificado de participación</h1><p>Se certifica que</p><h1>${esc(E.nombre)}</h1>
    <p>completó la aventura «Tu primera aventura en gestión de riesgos» y obtuvo la medalla de <b>${med}</b> (${est} de ${max} estrellas).</p>
    ${E.pre && E.post ? `<p>Prueba inicial: ${E.pre.bien} de 5 · Prueba final: ${E.post.bien} de 5.</p>` : ''}
    <p>Aprendió: ${E.palabras.map(id=>PALABRAS[id].t).join(', ')}.</p>
    <p style="margin-top:30px">Mentor: Gonzalo Mateo, consultor de riesgos · ${hoy}</p>`;
  window.print();
}

/* =====================================================================
   10. BUCLE PRINCIPAL — movimiento (teclas o ruta tocando el piso), dibujo del mapa con el signo «!» del objetivo,
   escena de los retos y arranque
   ===================================================================== */
const ORDEN_DIR = [];
document.addEventListener('keydown', e=>{ const k = TECLAS[e.key]; if(DIRS[k]){ const i = ORDEN_DIR.indexOf(k); if(i>=0) ORDEN_DIR.splice(i,1); ORDEN_DIR.push(k); } });
const dirActiva = () => { for(let i=ORDEN_DIR.length-1;i>=0;i--) if(G.teclas.has(ORDEN_DIR[i])) return ORDEN_DIR[i]; for(const k of G.teclas) return k; return null; };
$('dlg').addEventListener('click', ()=>{ if(Dlg.activo) Dlg.tecla('A'); });

function actualizar(dt){
  if(G.modo==='mapa' || G.modo==='reto') E.stats.tiempo += dt/1000;
  if(G.fadeObj===1){ G.fade = Math.min(1, G.fade+dt/220); if(G.fade>=1 && G.fadeFn){ const f = G.fadeFn; G.fadeFn = null; f(); } }
  else if(G.fade>0) G.fade = Math.max(0, G.fade-dt/260);
  const C = G.reto; if(C){ ['golpe','temblor','flash'].forEach(k=>C.anim[k] = Math.max(0, C.anim[k]-dt/400)); C.anim.entrada = Math.max(0, C.anim.entrada-dt/500);
    if(C.anim.calma>0) C.anim.calma = Math.min(1, C.anim.calma+dt/900); }
  if(G.modo!=='mapa' || !G.jug) return;
  const j = G.jug;
  if(j.mov){
    j.mov.t += dt; const k = Math.min(1, j.mov.t/150);
    j.px = (j.mov.x0 + (j.x-j.mov.x0)*k)*TS; j.py = (j.mov.y0 + (j.y-j.mov.y0)*k)*TS; j.f = 1 + (Math.floor(j.mov.t/75)%2);
    if(k>=1){ j.mov = null; j.f = 0; E.x = j.x; E.y = j.y; E.dir = j.dir; }
    return;
  }
  if(UI.tope() || G.fade>0) return;
  const d = dirActiva();
  if(d){ G.ruta = null; j.dir = d; const [dx,dy] = DIRS[d], nx = j.x+dx, ny = j.y+dy;
    if(libre(nx,ny)){ j.mov = {x0:j.x, y0:j.y, t:0}; j.x = nx; j.y = ny; }
    else { const r = riesgoEn(nx,ny); if(r){ G.teclas.clear(); encuentro(r); } }
    return; }
  if(G.ruta) seguirRuta();
}
// Un paso de la ruta trazada al tocar el mapa; al llegar, usa lo que se tocó
function seguirRuta(){
  const j = G.jug, R = G.ruta;
  if(!R.pasos.length){ G.ruta = null; if(R.alLlegar) R.alLlegar(); return; }
  const [nx,ny] = R.pasos[0];
  j.dir = nx>j.x ? 'derecha' : nx<j.x ? 'izquierda' : ny>j.y ? 'abajo' : 'arriba';
  if(!libre(nx,ny)){ G.ruta = null; return; }
  R.pasos.shift(); j.mov = {x0:j.x, y0:j.y, t:0}; j.x = nx; j.y = ny;
}
function sombra(x, y, w){ ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(x, y, w, w*.35, 0, 0, Math.PI*2); ctx.fill(); }
// Signo «!» sobre lo que hay que hacer ahora (persona, riesgo o ascensor)
function marcador(X, Y){
  const b = Math.round(Math.sin(G.t/180)*2), x = Math.round(X), y = Math.round(Y)+b;
  ctx.fillStyle = '#141626'; ctx.fillRect(x-5, y-10, 11, 12); ctx.fillRect(x-1, y+2, 3, 2);
  ctx.fillStyle = '#ffd166'; ctx.fillRect(x-4, y-9, 9, 10); ctx.fillRect(x, y+1, 1, 2);
  ctx.fillStyle = '#c0392b'; ctx.fillRect(x-1, y-7, 3, 4); ctx.fillRect(x-1, y-2, 3, 2);
}
function dibujarMapa(camX, camY){
  const M = pisoAct().mapa;
  for(let y=0;y<M.length;y++) for(let x=0;x<M[0].length;x++){ const X = x*TS-camX, Y = y*TS-camY; if(X<-TS||Y<-TS||X>ANCHO||Y>ALTO) continue; ctx.drawImage(tile(M[y][x], E.piso), X, Y); }
  const ents = [];
  G.npcs.forEach(n=>ents.push({y:n.y*TS, f:()=>{ const X = n.x*TS-camX, Y = n.y*TS-camY; sombra(X+8, Y+15, 6); ctx.drawImage(spritePersona(n.ap, AP[n.ap], n.dir, 0), X-1, Y-9); }}));
  G.riesgos.forEach(r=>ents.push({y:r.y*TS, f:()=>{ const X = r.x*TS-camX, Y = r.y*TS-camY, b = Math.round(Math.sin(G.t/260 + r.x)*1.5);
    sombra(X+8, Y+15, 8); ctx.drawImage(spriteRiesgo(r.id), X-5, Y-10+b); }}));
  if(G.jug){ const j = G.jug; ents.push({y:j.py, f:()=>{ const X = Math.round(j.px)-camX, Y = Math.round(j.py)-camY; sombra(X+8, Y+15, 6);
    ctx.drawImage(spritePersona('jug'+E.ap, AP_JUGADOR[E.ap], j.dir, j.f), X-1, Y-9); }}); }
  ents.sort((a,b)=>a.y-b.y).forEach(e=>e.f());
  // destino de la ruta (cuando se camina tocando el piso)
  if(G.ruta && G.ruta.pasos.length){ const [x,y] = G.ruta.pasos[G.ruta.pasos.length-1]; ctx.strokeStyle = 'rgba(255,209,102,.8)'; ctx.lineWidth = 1; ctx.strokeRect(x*TS-camX+2.5, y*TS-camY+2.5, 11, 11); }
  if(G.modo==='mapa') objetivoActual().blancos.forEach(b=>{ const esPared = !CAMINABLE.has(tileEn(b.x,b.y)) && !npcEn(b.x,b.y) && !riesgoEn(b.x,b.y);
    marcador(b.x*TS-camX+8, b.y*TS-camY + (esPared ? 10 : -14)); });
}
// Escena del reto: el riesgo a la derecha sobre su plataforma, con un aura del color de su nivel cuando se conoce
function dibujarReto(){
  const C = G.reto, r = C.r, fondo = PISOS[E.piso].fondo, ex = ANCHO-80;
  const gr = ctx.createLinearGradient(0,0,0,ALTO); gr.addColorStop(0, tono(fondo,1.35)); gr.addColorStop(.55, tono(fondo,1.05)); gr.addColorStop(1, tono(fondo,.6));
  ctx.fillStyle = gr; ctx.fillRect(0,0,ANCHO,ALTO);
  ctx.fillStyle = 'rgba(255,255,255,.05)'; for(let y=0;y<ALTO;y+=8) ctx.fillRect(0,y,ANCHO,3);
  ctx.save();
  if(C.anim.temblor>0) ctx.translate(Math.round(Math.sin(G.t/18)*4*C.anim.temblor), 0);
  ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(ex, 86, 50, 10, 0, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.beginPath(); ctx.ellipse(ex, 84, 46, 8, 0, 0, 7); ctx.fill();
  const esc2 = 2*(r.escala||1), s = spriteRiesgo(C.id), w = Math.round(26*esc2), h = w;
  const x = ex - w/2 + C.anim.entrada*140 + Math.sin(G.t/16)*4*C.anim.golpe, y = 86 - h + Math.round(Math.sin(G.t/320)*2);
  if(C.color!=null && C.anim.calma===0){ const col = hex2rgb(COLORES[C.color].c); ctx.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${.22+.1*Math.sin(G.t/200)})`;
    ctx.beginPath(); ctx.arc(ex, 86-h/2, w*.6, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1 - C.anim.calma*.85;
  if(!(C.anim.flash>0 && Math.floor(G.t/70)%2)){ const k = 1 - C.anim.calma*.4, ww = w*k, hh = h*k; ctx.drawImage(s, Math.round(x + (w-ww)/2), Math.round(y + (h-hh)), ww, hh); }
  ctx.globalAlpha = 1;
  if(C.anim.calma>0){ for(let i=0;i<10;i++){ const a = i/10*Math.PI*2 + G.t/400, rr = 14 + C.anim.calma*30; ctx.fillStyle = i%2 ? '#ffd166' : '#ffffff';
    ctx.fillRect(Math.round(ex + Math.cos(a)*rr), Math.round(86-h/2 + Math.sin(a)*rr*.6), 2, 2); } }
  ctx.restore();
  efecto(C, ex, 86-h/2, w);
}
// Animaciones: acierto (destello), escudo (control), evaluar (rejilla), respuesta (visto bueno) y golpe (error)
function efecto(C, cx, cy, w){
  const fx = C.fx; if(!fx) return; fx.t += 16; const k = Math.min(1, fx.t/700); if(k>=1){ C.fx = null; return; }
  ctx.save(); ctx.globalAlpha = 1-k*.8; ctx.lineWidth = 2;
  if(fx.tipo==='escudo'){ const r = w*.55*(0.6+k*.5); ctx.strokeStyle = '#7fd3ff'; ctx.fillStyle = 'rgba(127,211,255,.18)'; ctx.beginPath();
    for(let i=0;i<6;i++){ const a = Math.PI/3*i+Math.PI/6; ctx[i?'lineTo':'moveTo'](cx+Math.cos(a)*r, cy+Math.sin(a)*r); } ctx.closePath(); ctx.fill(); ctx.stroke(); }
  else if(fx.tipo==='respuesta' || fx.tipo==='acierto'){ ctx.strokeStyle = '#7dffa0'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(cx-14, cy); ctx.lineTo(cx-4, cy+10); ctx.lineTo(cx+16, cy-14*Math.min(1,k*2)); ctx.stroke(); }
  else if(fx.tipo==='evaluar'){ ctx.strokeStyle = '#ffd166'; const s = w*.9; for(let i=0;i<=3;i++){ ctx.beginPath(); ctx.moveTo(cx-s/2+i*s/3, cy-s/2); ctx.lineTo(cx-s/2+i*s/3, cy+s/2);
    ctx.moveTo(cx-s/2, cy-s/2+i*s/3); ctx.lineTo(cx+s/2, cy-s/2+i*s/3); ctx.stroke(); } }
  else if(fx.tipo==='golpe'){ ctx.fillStyle = 'rgba(255,60,60,.3)'; ctx.fillRect(0,0,ANCHO,ALTO); }
  ctx.restore();
}
function dibujarFondoTitulo(){
  const M = PISOS[1].mapa, ancho = Math.max(0, M[0].length*TS-ANCHO), t = ancho ? (G.t/60) % (ancho*2) : 0, camX = t<ancho ? t : ancho*2-t;
  for(let y=0;y<M.length;y++) for(let x=0;x<M[0].length;x++) ctx.drawImage(tile(M[y][x], 1), x*TS-camX, y*TS);
  ['cable','engranaje','chispa','moroso','pulpo'].forEach((id,k)=>{ const X = ((G.t/25 + k*80) % (ANCHO+80)) - 40, Y = 120 + Math.sin(G.t/300+k)*4; ctx.drawImage(spriteRiesgo(id), Math.round(X), Math.round(Y)); });
  ctx.drawImage(spritePersona('gonzalo', AP.gonzalo, 'abajo', Math.floor(G.t/250)%3), Math.round(ANCHO/2)-10, 70, 36, 52);
}
let ultimo = performance.now();
function bucle(ahora){
  try{ cuadro(ahora); }catch(e){ console.error('RiskQuest Go:', e); }
  requestAnimationFrame(bucle);
}
function cuadro(ahora){
  const dt = Math.max(0, Math.min(50, ahora-ultimo)); ultimo = ahora; G.t += dt; actualizar(dt);
  ctx.setTransform(1,0,0,1,0,0); ctx.imageSmoothingEnabled = false; ctx.fillStyle = '#000'; ctx.fillRect(0,0,ANCHO,ALTO);
  if(G.modo==='reto' && G.reto) dibujarReto();
  else if((G.modo==='mapa' || G.modo==='final') && G.jug){ const j = G.jug, M = pisoAct().mapa;
    const camX = Math.max(0, Math.min(M[0].length*TS-ANCHO, Math.round(j.px)+8-ANCHO/2)), camY = Math.max(0, Math.min(M.length*TS-ALTO, Math.round(j.py)+8-ALTO/2));
    G.cam = {x:camX, y:camY}; dibujarMapa(camX, camY);
    const sx = j.px-camX, sy = j.py-camY, h = $('hud'); h.style.opacity = (sx<ANCHO*.62 && sy<52) ? .3 : 1; }
  else dibujarFondoTitulo();
  if(G.fade>0){ ctx.fillStyle = `rgba(0,0,0,${G.fade})`; ctx.fillRect(0,0,ANCHO,ALTO); }
}
aplicarAjustes();
pantallaTitulo();
requestAnimationFrame(bucle);

</script>
