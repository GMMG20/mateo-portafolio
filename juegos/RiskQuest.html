<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RiskQuest · Industrias Aurora</title>
<style>
/* RiskQuest — RPG de gestión de riesgos. Un solo archivo: el mundo se dibuja en <canvas>, los textos y menús son HTML encima. */
*{box-sizing:border-box;margin:0;padding:0;}
:root{--u:3px; --azul:#1c2f7a; --azul2:#0d1747; --borde:#e9eeff; --oro:#ffd166; --txt:#ffffff; --sombra:#060b24;}
html,body{height:100%;background:#0a0e1f;color:var(--txt);}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:100vh;padding:8px;
  font-family:"Lucida Console","Consolas","Courier New",monospace;-webkit-font-smoothing:none;user-select:none;-webkit-user-select:none;}
/* El tamaño exacto de #juego lo calcula ajustar(): ocupa toda la ventana y, en pantallas anchas, el lienzo crece de 320 a 384 px de ancho */
#juego{position:relative;width:320px;height:192px;flex:none;background:#000;box-shadow:0 0 0 2px #1d2550,0 12px 40px rgba(0,0,0,.6);overflow:hidden;}
body.pc{padding:0;gap:0;background:#000;} body.pc #juego{box-shadow:none;}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block;}
#ui{position:absolute;inset:0;pointer-events:none;font-size:calc(var(--u)*7.2);line-height:1.35;}
#ui > *{pointer-events:auto;}
[hidden]{display:none!important;}

/* Cajas estilo JRPG */
.caja{background:linear-gradient(180deg,var(--azul),var(--azul2));border:calc(var(--u)*1.2) solid var(--borde);border-radius:calc(var(--u)*3);
  box-shadow:0 0 0 calc(var(--u)*0.8) var(--sombra), inset 0 0 0 calc(var(--u)*0.8) #5d74c9;color:var(--txt);text-shadow:calc(var(--u)*.5) calc(var(--u)*.5) 0 #000;}
.titulo-caja{color:var(--oro);font-weight:700;letter-spacing:.04em;}

/* Diálogo */
#dlg{position:absolute;left:3%;right:3%;bottom:3%;min-height:30%;padding:calc(var(--u)*5) calc(var(--u)*7);display:flex;gap:calc(var(--u)*5);align-items:flex-start;}
#dlg canvas{width:calc(var(--u)*40);height:calc(var(--u)*40);image-rendering:pixelated;flex:none;background:#0b1440;border:calc(var(--u)*.8) solid #8fa3e6;border-radius:calc(var(--u)*2);}
#dlg .cuerpo{flex:1;min-width:0;}
#dlg .nom{color:var(--oro);font-weight:700;margin-bottom:calc(var(--u)*1.5);}
#dlg .txt{white-space:pre-wrap;min-height:3.4em;}
#dlg .mas{position:absolute;right:calc(var(--u)*5);bottom:calc(var(--u)*3);color:var(--oro);animation:parpadeo .8s steps(2) infinite;}
@keyframes parpadeo{50%{opacity:0;}}

/* Listas de opciones navegables con teclado */
.lista{display:grid;gap:calc(var(--u)*1.5);}
.op{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:transparent;border:0;padding:calc(var(--u)*1.6) calc(var(--u)*3) calc(var(--u)*1.6) calc(var(--u)*9);
  position:relative;cursor:pointer;text-shadow:inherit;border-radius:calc(var(--u)*1.5);}
.op.sel{background:rgba(255,255,255,.12);}
.op.sel::before{content:"▶";position:absolute;left:calc(var(--u)*2);color:var(--oro);}
.op[disabled]{opacity:.45;cursor:default;}
.op small{display:block;font-size:.8em;opacity:.8;font-weight:400;}
.tag{display:inline-block;font-size:.75em;padding:0 calc(var(--u)*1.5);border-radius:calc(var(--u)*1);background:#3b4f9e;margin-left:calc(var(--u)*1.5);vertical-align:middle;}
.tag.prev{background:#2f8f5b;} .tag.det{background:#c08a1e;} .tag.corr{background:#a8443c;}

/* Capa genérica para menús, minijuegos y pantallas */
/* Las capas se apilan en la misma celda (no lado a lado): un submenú tapa al menú que lo abrió, y este se oculta mientras tanto */
#ui #capa{position:absolute;inset:0;display:grid;grid-template:100%/100%;place-items:center;pointer-events:none;}
#capa > *{pointer-events:auto;grid-area:1/1;}
#capa > .panel:has(~ .panel){visibility:hidden;}
#capa:empty{display:none;}
.panel{position:relative;z-index:3;padding:calc(var(--u)*6) calc(var(--u)*8);max-width:92%;max-height:92%;overflow:auto;}
#dlg{z-index:5;} .toast{z-index:6;}
.panel h2{font-size:1.15em;color:var(--oro);margin-bottom:calc(var(--u)*3);}
.panel p{margin-bottom:calc(var(--u)*3);}
.ayuda{font-size:.78em;opacity:.75;margin-top:calc(var(--u)*3);}

/* Pantalla de título */
.titulo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*6);
  background:radial-gradient(ellipse at 50% 35%,#2a3f9e 0%,#101a4d 55%,#070b22 100%);}
.logo{font-size:calc(var(--u)*24);font-weight:900;letter-spacing:.06em;color:#ffd166;text-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 #b5402f, calc(var(--u)*3) calc(var(--u)*3) 0 #000;}
.sublogo{margin-top:calc(var(--u)*-4);color:#cfe0ff;letter-spacing:.12em;font-size:.9em;}
.titulo .lista{min-width:44%;}

/* HUD del mapa */
#hud{position:absolute;left:2%;top:3%;padding:calc(var(--u)*2.5) calc(var(--u)*4);font-size:.8em;min-width:32%;}
.barra{height:calc(var(--u)*3.2);background:#0a0f2c;border:calc(var(--u)*.6) solid #8fa3e6;border-radius:calc(var(--u)*1);overflow:hidden;margin:calc(var(--u)*.8) 0 calc(var(--u)*1.5);}
.barra i{display:block;height:100%;background:#5be37a;transition:width .35s;}
.barra.pres i{background:#57b8ff;} .barra.exp i{background:#ff7b6b;} .barra.xp i{background:#ffd166;}
.fila{display:flex;justify-content:space-between;gap:calc(var(--u)*4);}

/* Combate */
.ficha{position:absolute;padding:calc(var(--u)*3) calc(var(--u)*5);width:44%;font-size:.85em;}
.ficha.ene{left:3%;top:4%;} .ficha.jug{right:3%;top:47%;}
.nivel{display:inline-block;padding:0 calc(var(--u)*2);border-radius:calc(var(--u)*1);font-size:.85em;margin-left:calc(var(--u)*2);color:#fff;}
#menuCombate{position:absolute;left:3%;right:3%;bottom:3%;height:30%;display:grid;grid-template-columns:1.25fr 1fr;gap:calc(var(--u)*3);}
#menuCombate .msg{padding:calc(var(--u)*4) calc(var(--u)*6);white-space:pre-wrap;overflow:auto;}
#menuCombate .acc{padding:calc(var(--u)*3);display:grid;grid-template-columns:1fr;align-content:center;gap:calc(var(--u)*1);}
#menuCombate.ancho{grid-template-columns:1fr;height:46%;}
#menuCombate.ancho .msg{display:none;}
#menuCombate.ancho .acc{align-content:start;overflow:auto;font-size:.88em;}
#menuCombate .acc{overflow:auto;}

/* Minijuego de la matriz */
.mjm{display:grid;grid-template-columns:auto 1fr;gap:calc(var(--u)*6);align-items:start;}
.matriz{display:grid;grid-template-columns:calc(var(--u)*25) repeat(5,calc(var(--u)*16));gap:calc(var(--u)*1);font-size:.6em;}
.matriz .h{display:flex;align-items:center;justify-content:center;text-align:center;color:#cfe0ff;line-height:1.1;}
.matriz .cel{height:calc(var(--u)*13);border:calc(var(--u)*.7) solid rgba(0,0,0,.35);border-radius:calc(var(--u)*1);cursor:pointer;}
.matriz .cel.sel{outline:calc(var(--u)*1.2) solid #fff;outline-offset:calc(var(--u)*.3);}
.escalas{font-size:.64em;line-height:1.25;} .escalas p{margin-bottom:calc(var(--u)*2);}
.escalas b{color:var(--oro);}
.kri{margin:calc(var(--u)*3) 0;}
.kri .regla{position:relative;height:calc(var(--u)*7);border-radius:calc(var(--u)*1.5);overflow:hidden;display:flex;}
.kri .regla span{flex:1;}
.kri .aguja{position:absolute;top:calc(var(--u)*-1);bottom:calc(var(--u)*-1);width:calc(var(--u)*1.2);background:#fff;box-shadow:0 0 0 calc(var(--u)*.5) #000;}

/* Tarjetas, glosario, resultados */
.tarjeta{border-left:calc(var(--u)*1.5) solid var(--oro);padding-left:calc(var(--u)*4);margin:calc(var(--u)*2) 0;}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*5);}
.apariencias{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*3);margin:calc(var(--u)*3) 0;}
.apariencias canvas{width:100%;image-rendering:pixelated;background:#0b1440;border-radius:calc(var(--u)*2);border:calc(var(--u)*.8) solid transparent;cursor:pointer;}
.apariencias canvas.sel{border-color:var(--oro);}
input.nombre{font:inherit;color:#fff;background:#0a0f2c;border:calc(var(--u)*.8) solid #8fa3e6;border-radius:calc(var(--u)*1.5);padding:calc(var(--u)*2) calc(var(--u)*3);width:100%;}
.toast{position:absolute;left:50%;top:6%;transform:translateX(-50%);padding:calc(var(--u)*2.5) calc(var(--u)*6);font-size:.85em;pointer-events:none;}

/* Accesibilidad: texto grande y modo para daltonismo */
body.texto-grande #ui{font-size:calc(var(--u)*8.6);}
.matriz .cel{display:flex;align-items:center;justify-content:center;}
.sim{display:none;font-style:normal;font-weight:900;color:rgba(0,0,0,.65);text-shadow:none;}
body.daltonico .sim{display:inline;}
body.daltonico .matriz .cel.n0{background-image:radial-gradient(rgba(0,0,0,.25) 15%,transparent 16%)!important;background-size:6px 6px!important;}
body.daltonico .matriz .cel.n1{background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.22) 0 2px,transparent 2px 6px)!important;}
body.daltonico .matriz .cel.n2{background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 2px,transparent 2px 5px)!important;}
body.daltonico .matriz .cel.n3{background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.28) 0 2px,transparent 2px 4px),repeating-linear-gradient(-45deg,rgba(0,0,0,.28) 0 2px,transparent 2px 4px)!important;}
.kri .regla span{display:flex;align-items:center;justify-content:center;}
/* Modo facilitador */
.letra{display:inline-block;min-width:1.6em;text-align:center;background:var(--oro);color:#1c2f7a;border-radius:calc(var(--u)*1.2);text-shadow:none;margin-right:calc(var(--u)*1.5);}
.cronometro{position:absolute;right:2%;top:3%;z-index:7;padding:calc(var(--u)*2.5) calc(var(--u)*5);font-size:.85em;pointer-events:none;}
.cronometro.fin{background:linear-gradient(180deg,#8a1f1f,#4a0f0f);}
/* Bow-tie */
.bowtie{display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;gap:calc(var(--u)*2);align-items:center;font-size:.7em;margin-bottom:calc(var(--u)*3);}
.bt-col{display:flex;flex-direction:column;gap:calc(var(--u)*1);min-height:calc(var(--u)*24);background:rgba(255,255,255,.06);border-radius:calc(var(--u)*2);padding:calc(var(--u)*2);}
.bt-col b{color:var(--oro);}
.bt-col span{border-radius:calc(var(--u)*1);padding:calc(var(--u)*.8) calc(var(--u)*1.5);background:#2f8f5b;}
.bt-col span.mal{background:#a8443c;}
.bt-evento{background:#c53532;border-radius:50%;padding:calc(var(--u)*5) calc(var(--u)*3);text-align:center;font-weight:700;max-width:calc(var(--u)*46);}
/* Logros */
.logros{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*2.5);}
.logro{display:flex;gap:calc(var(--u)*3);align-items:center;opacity:.5;font-size:.85em;}
.logro.ok{opacity:1;} .logro span{font-size:1.6em;}

/* Controles táctiles */
#tactil{display:none;width:960px;max-width:100%;flex:none;justify-content:space-between;align-items:center;padding:0 6px;}
body.tactil #tactil{display:flex;}
.cruz{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;}
.cruz button,.ab button{font:700 18px/1 system-ui,sans-serif;color:#fff;background:#24306b;border:2px solid #6f86d6;border-radius:12px;touch-action:none;}
.cruz .c-up{grid-column:2;grid-row:1;} .cruz .c-left{grid-column:1;grid-row:2;} .cruz .c-right{grid-column:3;grid-row:2;} .cruz .c-down{grid-column:2;grid-row:3;}
.ab{display:flex;gap:14px;} .ab button{width:64px;height:64px;border-radius:50%;}
.ab .a{background:#b5402f;} .ab .b{background:#3b4f9e;}

/* Certificado imprimible */
#certificado{display:none;}
@media print{
  body{background:#fff;color:#000;display:block;padding:0;}
  body > *:not(#certificado){display:none!important;}
  #certificado{display:block!important;font-family:Georgia,serif;text-align:center;padding:40px;border:6px double #1c2f7a;margin:30px;}
  #certificado h1{font-size:28pt;color:#1c2f7a;margin:10px 0 20px;}
  #certificado p{font-size:13pt;margin:10px 0;}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<div id="juego" aria-label="RiskQuest, juego de gestión de riesgos">
  <canvas id="cv" width="320" height="192"></canvas>
  <div id="ui">
    <div id="hud" class="caja" hidden></div>
    <div id="dlg" class="caja" hidden role="dialog" aria-live="polite">
      <canvas id="retrato" width="48" height="48"></canvas>
      <div class="cuerpo"><div class="nom"></div><div class="txt"></div></div>
      <span class="mas">▼</span>
    </div>
    <div id="capa"></div>
  </div>
</div>
<div id="tactil" aria-hidden="true">
  <div class="cruz">
    <button class="c-up" data-k="ArrowUp">▲</button><button class="c-left" data-k="ArrowLeft">◀</button>
    <button class="c-right" data-k="ArrowRight">▶</button><button class="c-down" data-k="ArrowDown">▼</button>
  </div>
  <div class="ab"><button class="b" data-k="Escape">B</button><button class="a" data-k="Enter">A</button></div>
</div>
<div id="certificado"></div>
<script>
/* =====================================================================
   1. DATOS BASE — matriz, apetito, escalas, glosario, herramientas, habilidades, logros, prueba y ajustes
   (todo el contenido educativo está en objetos para poder editarlo sin tocar el motor)
   ===================================================================== */
const VERSION = 2;
const CLAVE_GUARDADO = 'riskquest_aurora_v2';
// Matriz 5×5: filas = probabilidad 1..5, columnas = impacto 1..5, valor = índice de nivel
const MATRIZ = [[0,0,1,2,2],[0,0,1,2,3],[0,1,2,3,3],[1,2,2,3,3],[2,2,3,3,3]];
const NIVELES = [{n:'Bajo',c:'#3a8dff',s:'B'},{n:'Moderado',c:'#4ca82b',s:'M'},{n:'Alto',c:'#e0a800',s:'A'},{n:'Extremo',c:'#c53532',s:'E'}];
const nivelDe = (p,i) => MATRIZ[Math.max(1,Math.min(5,p))-1][Math.max(1,Math.min(5,i))-1];
// Apetito de Industrias Aurora: acepta con monitoreo los riesgos de nivel Bajo y Moderado
const APETITO = 1;
const ESC_P = [
  ['1 · Raro','menos de 1 vez en 10 años'],
  ['2 · Improbable','1 vez cada 5 a 10 años'],
  ['3 · Posible','1 vez cada 1 a 5 años'],
  ['4 · Probable','varias veces al año'],
  ['5 · Casi seguro','cada mes o más']];
const ESC_I = [
  ['1 · Insignificante','menos de USD 10 mil; sin lesionados'],
  ['2 · Menor','USD 10 a 100 mil; lesión leve'],
  ['3 · Moderado','USD 0,1 a 1 millón; parada de días'],
  ['4 · Mayor','USD 1 a 5 millones; parada de semanas'],
  ['5 · Catastrófico','más de USD 5 millones; víctimas']];
const RESPUESTAS = {
  mitigar:{n:'Mitigar', d:'Reducir la probabilidad o el impacto con un control.'},
  transferir:{n:'Transferir', d:'Pasar el impacto financiero a un tercero: un seguro o un contrato.'},
  aceptar:{n:'Aceptar', d:'Convivir con el riesgo y monitorearlo, porque está dentro del apetito.'},
  evitar:{n:'Evitar', d:'Dejar de hacer la actividad que genera el riesgo.'}
};
// Un control preventivo baja la probabilidad; uno detectivo o correctivo baja el impacto
const TIPO_CONTROL = {preventivo:['Preventivo','prev','P'], detectivo:['Detectivo','det','I'], correctivo:['Correctivo','corr','I']};
const COSTO_CONTROL = {3:12, 2:7, 1:4}, PRIMA = 10, COSTO_EVITAR = 20, AYUDA_COMITE = 20, CASTIGO_COMITE = 15;

// Glosario: se desbloquea a medida que el jugador aprende
const GLOSARIO = {
  riesgo:{t:'Riesgo', d:'La posibilidad de que ocurra un evento que afecte el logro de los objetivos. Se describe con su causa, el evento y su consecuencia.'},
  ccc:{t:'Causa, evento y consecuencia', d:'La causa es la condición que lo origina (un cable sin canaleta); el evento es lo que pasa (alguien tropieza); la consecuencia es el efecto (una lesión, un reclamo).'},
  redaccion:{t:'Redactar un riesgo', d:'«Posibilidad de [evento] debido a [causa], lo que generaría [consecuencia]». Una causa sola, una consecuencia sola o algo que ya ocurrió (un incidente) no son riesgos bien redactados.'},
  inherente:{t:'Riesgo inherente y residual', d:'Inherente: el nivel antes de los controles. Residual: el que queda después de aplicarlos. La gestión termina cuando el residual entra en el apetito.'},
  apetito:{t:'Apetito y tolerancia', d:'Cuánto riesgo acepta la empresa para lograr sus objetivos. Industrias Aurora acepta con monitoreo los riesgos Bajos y Moderados; los Altos y Extremos se tratan hasta llevarlos allí.'},
  probabilidad:{t:'Probabilidad', d:'Qué tan seguido puede ocurrir el evento. Se apoya en la historia, en datos del sector y en el criterio de quienes conocen el proceso.'},
  impacto:{t:'Impacto', d:'Qué tan grave sería la consecuencia: en dinero, personas, operación, reputación o cumplimiento. Se usa el peor escenario razonable.'},
  matriz:{t:'Matriz de calor', d:'Cruza probabilidad e impacto para obtener el nivel del riesgo (Bajo, Moderado, Alto, Extremo). Sirve para comparar riesgos distintos con la misma regla.'},
  bowtie:{t:'Bow-tie (corbatín)', d:'Diagrama con el evento en el centro: a la izquierda las causas y las barreras preventivas; a la derecha las barreras de mitigación y las consecuencias.'},
  controles:{t:'Tipos de control', d:'Preventivo: evita que el evento ocurra y baja la probabilidad. Detectivo: lo descubre a tiempo. Correctivo: reduce el daño cuando ya pasó. Los dos últimos bajan el impacto.'},
  respuestas:{t:'Respuestas al riesgo', d:'Mitigar (controles), transferir (seguros o contratos), aceptar (dentro del apetito) o evitar (no hacer la actividad). A veces la mejor respuesta combina dos.'},
  ciber:{t:'Riesgo cibernético', d:'Pérdidas por ataques, fallas o accesos indebidos a la información y la tecnología: secuestro de datos, fraude por correo, caída de sistemas o fuga de datos personales.'},
  kri:{t:'KRI: indicador clave de riesgo', d:'Una medición que avisa antes de que el riesgo se materialice. Tiene umbrales: verde (normal), amarillo (alertar al dueño del riesgo) y rojo (escalar y activar el plan de respuesta). Un buen KRI mira hacia adelante y se mide con la frecuencia adecuada.'},
  transferencia:{t:'Transferencia y seguros', d:'Un seguro traslada el impacto financiero a cambio de una prima. Hay que revisar la cobertura, los límites, el deducible (lo que asume la empresa) y las exclusiones.'},
  combinar:{t:'Combinar respuestas', d:'El seguro no evita el evento: paga parte de la pérdida. Por eso los riesgos graves se gestionan combinando prevención y transferencia.'},
  proyecto:{t:'Riesgos de proyecto', d:'Amenazas al alcance, el cronograma, el costo y la calidad de un proyecto. Se gestionan con un registro de riesgos, dueños claros y reservas de contingencia de tiempo y dinero.'},
  contractual:{t:'Transferencia contractual', d:'Además de los seguros, un contrato puede trasladar un riesgo: precio fijo, penalidades o garantías de cumplimiento. Solo funciona si el tercero puede asumirlo.'},
  dueno:{t:'Dueño del riesgo', d:'La persona que gestiona el proceso donde nace el riesgo y responde por sus controles. El área de riesgos acompaña, mide y reporta, pero no reemplaza al dueño.'},
  lineas:{t:'Tres líneas de defensa', d:'Primera: los dueños de los procesos, que operan los controles. Segunda: riesgos y cumplimiento, que definen el marco y vigilan. Tercera: auditoría interna, que da aseguramiento independiente.'},
  estrategico:{t:'Riesgos estratégicos y oportunidades', d:'Cambios en el mercado, la competencia, la tecnología o la regulación que afectan la estrategia. Bien gestionados, pueden convertirse en oportunidades.'},
  escenarios:{t:'Análisis de escenarios', d:'Imaginar un escenario optimista, uno base y uno pesimista. Se planea con el base y se prepara un plan de contingencia para el pesimista.'},
  incidente:{t:'Incidentes y lecciones aprendidas', d:'Un incidente es un riesgo que ya ocurrió. Se analiza qué falló, se corrige el control y se registra la lección para que no se repita.'},
  reporte:{t:'Reporte al directorio', d:'Un buen reporte muestra el nivel actual, la tendencia del KRI, el dueño, el plan de tratamiento y lo que se necesita del directorio.'}
};

// Herramientas que entrega Gonzalo: cada una desbloquea una habilidad en combate
const HERRAMIENTAS = {
  libreta:{n:'Libreta de riesgos', d:'Te deja IDENTIFICAR la causa de un riesgo y descubrir riesgos ocultos: si algo brilla en el piso, revísalo.', icono:'📓'},
  matriz:{n:'Matriz de calor', d:'EVALUAR ahora es ubicar el riesgo en la matriz de probabilidad e impacto.', icono:'🟥'},
  controles:{n:'Mapa de controles', d:'Muestra si cada control es preventivo (baja la probabilidad), detectivo o correctivo (bajan el impacto).', icono:'🗺️'},

function rejilla(ap, dir, f){
  const g = Array.from({length:24}, ()=>Array(16).fill('.'));

    g[y][x] = c; } });

// ---------- Criaturas (riesgos) en un búfer de 24×24 con contorno y sombreado automáticos ----------
function criatura(def){
  const N = 24, B = Array.from({length:N}, ()=>Array(N).fill(null));
  const pon = (x,y,col)=>{ x=Math.round(x); y=Math.round(y); if(x>=0&&y>=0&&x<N&&y<N) B[y][x] = col; };
  const circ = (cx,cy,rad,col)=>{ for(let y=0;y<N;y++) for(let x=0;x<N;x++) if((x-cx)**2+(y-cy)**2 <= rad*rad+rad*0.6) B[y][x] = col; };
  const elip = (cx,cy,rx,ry,col)=>{ for(let y=0;y<N;y++) for(let x=0;x<N;x++) if(((x-cx)/rx)**2+((y-cy)/ry)**2 <= 1.05) B[y][x] = col; };
  const rect = (x0,y0,w,h,col)=>{ for(let y=y0;y<y0+h;y++) for(let x=x0;x<x0+w;x++) pon(x,y,col); };
  const linea = (x0,y0,x1,y1,col,g=0)=>{ const n = Math.max(Math.abs(x1-x0),Math.abs(y1-y0))*2+1; for(let k=0;k<=n;k++){ const t = k/n, x = x0+(x1-x0)*t, y = y0+(y1-y0)*t; g ? circ(x,y,g,col) : pon(x,y,col); } };
  const ojos = (x1,y,x2,enojo)=>{ rect(x1,y,2,2,'#ffffff'); rect(x2,y,2,2,'#ffffff'); pon(x1+1,y+1,'#111'); pon(x2,y+1,'#111');
    if(enojo){ pon(x1-1,y-2,'#111'); pon(x1,y-2,'#111'); pon(x1+1,y-1,'#111'); pon(x2+2,y-2,'#111'); pon(x2+1,y-2,'#111'); pon(x2,y-1,'#111'); } };
  const a = def.pal.a, a2 = tono(a,.72), a3 = tono(a,1.3), roj = def.pal.r || '#e85d4a';
  switch(def.forma){
    case 'cable': for(let t=0;t<=1;t+=.02) circ(3+t*13, 20-t*11+Math.sin(t*9)*2.2, 1.4, a); rect(14,2,8,8,'#d0d5dd'); rect(16,0,1,2,'#8a8f99'); rect(19,0,1,2,'#8a8f99'); ojos(15,4,19,true); rect(16,8,4,1,'#555'); break;
    case 'engranaje': for(let k=0;k<8;k++){ const g = k*Math.PI/4; rect(Math.round(11+Math.cos(g)*9), Math.round(11+Math.sin(g)*9), 3, 3, a2); }
      circ(12,12,8,a); circ(12,12,3,a2); ojos(8,8,14,true); rect(9,15,7,1,roj); pon(9,14,roj); pon(15,14,roj); break;
    case 'chispa': circ(12,16,7,a); circ(12,11,5,a); circ(12,7,3,a); circ(13,4,2,a); circ(9,8,2,a); circ(12,16,4,'#ffd166'); circ(12,13,3,'#ffd166'); circ(12,17,2,'#fff3b0'); ojos(9,13,14,true); break;
    case 'moneda': elip(3,9,3,2,'#ffffff'); elip(20,9,3,2,'#ffffff'); circ(12,12,8,a); circ(12,12,6,a3); ojos(8,10,14,false); rect(10,15,4,1,a2); rect(11,5,2,3,a2); break;
    case 'diamante': for(let y=4;y<=20;y++){ const w = y<=8 ? 3+(y-4)*2 : Math.max(0, 11-(y-8)*0.95); for(let x=Math.round(12-w);x<=Math.round(12+w);x++) pon(x,y,a); }
      linea(12,4,6,8,a3); linea(12,4,18,8,a3); rect(3,8,19,1,a3); linea(12,9,12,19,a2); ojos(8,11,14,false); pon(19,3,'#ffffff'); pon(20,2,'#ffffff'); pon(4,5,'#ffffff'); break;
    case 'pulpo': for(let k=0;k<5;k++) for(let t=0;t<=1;t+=.05) circ(4.5+k*3.6+Math.sin(t*6+k)*1.3, 13+t*9, 1.2, a2);
      elip(12,8,8,7,a); circ(8,4,1.3,a3); circ(15,5,1,a3); ojos(8,8,14,true); rect(12,0,1,2,'#9aa5b1'); pon(12,0,'#ff3b30'); rect(10,12,4,1,'#111'); break;
    case 'servidor': circ(18,2,2,'#c8cdd5'); circ(20,0,1.5,'#dfe3ea'); rect(5,3,14,19,a); [6,10].forEach(y=>{ rect(7,y,10,2,a2); pon(15,y,'#2ecc71'); pon(13,y,'#f1c40f'); });
      rect(7,14,10,6,'#9be7ff'); ojos(8,15,14,false); rect(10,18,4,1,'#2d3748'); pon(9,17,'#2d3748'); pon(14,17,'#2d3748'); break;
    case 'hidra': linea(8,17,5,9,a,1.3); linea(12,16,12,6,a,1.3); linea(16,17,19,9,a,1.3); elip(12,19,8,4,a); circ(5,7,3,a); circ(12,4,3.2,a); circ(19,7,3,a);
      [[4,6],[11,3],[13,3],[18,6],[6,6],[20,6]].forEach(([x,y])=>pon(x,y,'#ff3b30')); rect(9,20,6,1,a2); break;
    case 'nube': circ(8,11,5,a); circ(13,8,6,a); circ(18,11,5,a); rect(6,11,14,5,a); linea(13,16,10,19,'#ffd166'); linea(10,19,13,19,'#ffd166'); linea(13,19,10,23,'#ffd166');
      [[6,19],[17,20],[19,17],[4,22]].forEach(([x,y])=>pon(x,y,'#ffffff')); ojos(10,10,15,true); break;
    case 'documento': elip(3,10,3,2,'#ffffff'); elip(20,10,3,2,'#ffffff'); rect(6,3,12,18,a); for(let y=3;y<6;y++) for(let x=15+(y-3);x<18;x++) pon(x,y,null);
      linea(15,3,17,5,a2); [7,9,11].forEach(y=>rect(8,y,7,1,'#9aa0aa')); ojos(9,14,13,true); rect(10,18,4,1,'#c0392b'); break;
    case 'reloj': circ(6,4,2.5,a2); circ(18,4,2.5,a2); rect(7,19,2,4,'#555'); rect(15,19,2,4,'#555'); circ(12,12,8,a); circ(12,12,6,'#f4f6f8');
      ojos(8,8,14,true); linea(12,13,12,16,'#111'); linea(12,13,15,13,'#111'); [[12,6],[18,12],[12,18],[6,12]].forEach(([x,y])=>pon(x,y,a2)); break;
    case 'globo': linea(12,19,12,23,'#666'); elip(12,10,8,9,a); rect(11,19,3,2,a2); circ(9,6,1.5,a3); ojos(8,9,14,false); rect(10,14,4,1,a2); break;
    case 'fantasma': circ(12,10,8,a); rect(4,10,17,9,a); for(let x=4;x<=20;x+=4) circ(x+1,19,2,a); rect(6,2,13,3,'#f2c230'); rect(4,4,17,1,'#f2c230');
      rect(8,9,2,3,'#111'); rect(14,9,2,3,'#111'); rect(10,15,4,2,'#111'); break;
    case 'charco': elip(12,18,10,4,a); elip(8,17,3,1,a3); circ(15,9,1.5,a); circ(15,12,1,a); ojos(8,14,14,false); break;
    case 'robot': linea(12,1,12,4,'#555'); pon(12,0,'#ff3b30'); rect(3,9,3,7,a2); rect(18,9,3,7,a2); rect(8,17,3,6,a2); rect(13,17,3,6,a2); rect(6,5,12,12,a);
      rect(7,7,10,3,'#1d2a3a'); pon(9,8,'#ff3b30'); pon(14,8,'#ff3b30'); rect(9,12,6,1,a2); rect(9,14,6,1,a2); break;
    case 'ola': elip(12,18,10,5,a); circ(14,10,7,a); circ(12,13,3,null); circ(18,5,2,'#ffffff'); circ(20,8,1.5,'#ffffff'); circ(9,4,1.5,'#ffffff'); ojos(14,9,18,true); break;
  }
  // sombreado y contorno automáticos
  const S = B.map(f=>f.slice()), lleno = (x,y)=> x>=0&&y>=0&&x<N&&y<N && B[y][x];
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){ const c = B[y][x]; if(!c || c==='#ffffff' || c==='#111') continue;
    if(!lleno(x+1,y+1)) S[y][x] = tono(c,.78); else if(!lleno(x-1,y-1)) S[y][x] = tono(c,1.18); }
  const [cv,cx] = lienzo(N+2,N+2);
  for(let y=-1;y<=N;y++) for(let x=-1;x<=N;x++){
    if(lleno(x,y)){ cx.fillStyle = S[y][x]; cx.fillRect(x+1,y+1,1,1); }
    else if(lleno(x-1,y)||lleno(x+1,y)||lleno(x,y-1)||lleno(x,y+1)){ cx.fillStyle = CONTORNO; cx.fillRect(x+1,y+1,1,1); } }
  return cv;
}

// Pistas lo-fi: compases de 16 pasos. prog = un acorde por compás (se toca rasgueado y suave), bajo en la fundamental y la quinta,
// batería en patrones de 16 pasos (x = golpe, o = platillo abierto), swing en los contratiempos y melodía opcional [paso, nota, duración]
const LOFI = {
  lofi_titulo:{tempo:80, swing:.18, filtro:2600, comp:true,
    prog:[['A3','C4','E4','G4','B4'],['D3','F3','A3','C4','E4'],['G3','B3','D4','F4','A4'],['C3','E3','G3','B3','D4']], bajo:['A2','D2','G2','C2'],
    kick:'x.......x.x.....', snare:'....x.......x...', hat:'x.x.x.x.x.x.x.xo',
    mel:[[[4,'E5',3],[8,'D5',2],[12,'C5',4]],[],[[2,'B4',2],[6,'D5',2],[10,'F5',3]],[[0,'E5',6]]]},
  lofi_mapa:{tempo:74, swing:.22, filtro:2200, comp:false,
    prog:[['F3','A3','C4','E4','G4'],['E3','G3','B3','D4'],['D3','F3','A3','C4','E4'],['C3','E3','G3','B3','D4']], bajo:['F2','E2','D2','C2'],
    kick:'x......x..x.....', snare:'....x.......x...', hat:'x.x.x.xxx.x.x.x.',
    mel:[[],[[6,'B4',2],[10,'G4',4]],[],[[2,'E5',2],[6,'D5',2],[8,'B4',6]]]},
  lofi_combate:{tempo:88, swing:.12, filtro:3200, comp:true,
    prog:[['A3','C4','E4','G4'],['F3','A3','C4','E4'],['D3','F3','A3','C4'],['E3','G#3','B3','D4']], bajo:['A2','F2','D2','E2'],
    kick:'x.....x...x.x...', snare:'....x.......x..x', hat:'xxxxxxxxxxxxxxxx', mel:[]},
  lofi_jefe:{tempo:96, swing:.08, filtro:3600, comp:true,
    prog:[['D3','F3','A3','C4'],['A#2','D3','F3','A3'],['C3','E3','G3','A#3'],['A2','C#3','E3','G3']], bajo:['D2','A#2','C2','A2'],
    kick:'x..x..x...x.x...', snare:'....x..x....x..x', hat:'xxxxxxxxxxxxxxxx', mel:[]}
};
const JINGLES = {
  victoria:{tempo:150, tipo:'square', vol:.06, n:'C5:2 E5:2 G5:2 C6:6 A5:2 B5:2 C6:8'},
  nivel:{tempo:180, tipo:'square', vol:.06, n:'G5:1 A5:1 B5:1 C6:1 D6:1 E6:1 G6:6'},
  derrota:{tempo:110, tipo:'triangle', vol:.1, n:'E4:4 D#4:4 D4:4 C#4:10'}
};
const ESTILOS = {
  mixta:{n:'Lo-fi + 8 bits', d:'Lo-fi hip hop al explorar y 8 bits en los combates'},
  lofi:{n:'Solo lo-fi', d:'Lo-fi hip hop en todo el juego, también en los combates'},
  chip:{n:'Solo 8 bits', d:'Música de consola clásica en todo el juego'},
  ninguna:{n:'Sin música', d:'Solo efectos de sonido, si están activados'}};
const ORDEN_ESTILOS = ['mixta','lofi','chip','ninguna'];
const Sonido = {
  ctx:null, master:null, bus:{}, vol:.75, estilo:'mixta', efectos:true, contexto:null, pista:null, timer:null, voces:[], lofi:null, ruido:null, previo:null, pendiente:null,
  cargar(){ try{ const o = JSON.parse(localStorage.getItem(CLAVE_GUARDADO+'_audio')||'{}');
    if(typeof o.vol==='number') this.vol = o.vol; if(ESTILOS[o.estilo]) this.estilo = o.estilo; if(typeof o.efectos==='boolean') this.efectos = o.efectos;
    if(o.mudo===true && !o.estilo){ this.estilo = 'ninguna'; this.efectos = false; } }catch(e){} },          // ajuste antiguo «silenciado»
  guardar(){ try{ localStorage.setItem(CLAVE_GUARDADO+'_audio', JSON.stringify({vol:this.vol, estilo:this.estilo, efectos:this.efectos})); }catch(e){} },
  // El navegador solo deja sonar audio después de una tecla o un clic: aquí se crea la mezcla
  // (maestro → música y efectos; el lo-fi pasa además por un vaivén de cinta y un filtro que lo apaga)
  desbloquear(){
    if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    const c = this.ctx = new AC(); this.master = c.createGain(); this.master.connect(c.destination);
    this.bus.musica = c.createGain(); this.bus.musica.gain.value = .85; this.bus.musica.connect(this.master);
    this.bus.efectos = c.createGain(); this.bus.efectos.connect(this.master);
    this.filtro = c.createBiquadFilter(); this.filtro.type = 'lowpass'; this.filtro.frequency.value = 2400; this.filtro.Q.value = .5; this.filtro.connect(this.bus.musica);
    this.cinta = c.createDelay(.05); this.cinta.delayTime.value = .012; this.cinta.connect(this.filtro);
    const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = .45; lg.gain.value = .0016; lfo.connect(lg); lg.connect(this.cinta.delayTime); lfo.start();
    this.bus.lofi = c.createGain(); this.bus.lofi.connect(this.cinta);
    this.ruido = c.createBuffer(1, c.sampleRate, c.sampleRate); const d = this.ruido.getChannelData(0); for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;

  },
  aplicarVol(){ if(!this.master) return; this.master.gain.value = this.vol; this.bus.efectos.gain.value = this.efectos ? 1 : 0; },
  frec(nom){ const m = nom.match(/^([A-G])(#?)(-?\d)$/); if(!m) return 0; const base = {C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]] + (m[2]?1:0); return 440*Math.pow(2, (12*(+m[3]+1)+base-69)/12); },
  parsear(s){ return s.replace(/\|/g,' ').trim().split(/\s+/).map(t=>{ const [n,d] = t.split(':'); return {f: n==='-' ? 0 : this.frec(n), d:+d||1}; }); },
  // Qué pista suena en cada contexto (titulo, mapa, combate, jefe) según el estilo elegido
  resolver(c){ const e = this.estilo; if(!c || e==='ninguna') return null; if(e==='chip') return c; if(e==='lofi') return 'lofi_'+c; return (c==='combate' || c==='jefe') ? c : 'lofi_'+c; },
  musica(contexto){
    this.contexto = contexto; const nom = this.resolver(contexto);
    if(nom && this.pista===nom && this.timer) return;
    this.parar(); this.pista = nom; if(!nom) return;
    if(!this.ctx){ this.pendiente = contexto; return; }

  cambiarEstilo(e){ this.estilo = e; this.guardar(); const c = this.contexto; this.parar(); this.musica(c); },
  // Tecla M: apaga la música o vuelve al último estilo elegido
  alternarMusica(){ if(this.estilo==='ninguna') this.cambiarEstilo(this.previo || 'mixta'); else { this.previo = this.estilo; this.cambiarEstilo('ninguna'); } return ESTILOS[this.estilo].n; },
  ciclarEstilo(){ this.cambiarEstilo(ORDEN_ESTILOS[(ORDEN_ESTILOS.indexOf(this.estilo)+1) % ORDEN_ESTILOS.length]); },
  subirVolumen(){ this.vol = [.25,.5,.75,1].find(v=>v>this.vol+.01) || .25; this.aplicarVol(); this.guardar(); },
  parar(){ clearInterval(this.timer); this.timer = null; this.pista = null; this.voces = [];
    if(this.lofi){ try{ this.lofi.crujido.stop(); }catch(e){} this.lofi = null; } },
  // ---------- 8 bits ----------
  nota(t, f, dur, tipo, vol){
    if(!f || !this.ctx) return; const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = tipo; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.008);
    g.gain.setValueAtTime(vol, t+Math.max(.01, dur*.75)); g.gain.linearRampToValueAtTime(0, t+dur*.95);
    o.connect(g); g.connect(this.bus.musica); o.start(t); o.stop(t+dur);
  },
  chipIniciar(nom){
    const P = PISTAS[nom]; if(!P) return; const seg = 60/P.tempo/4, t0 = this.ctx.currentTime+.08;
    const voces = this.voces = P.voces.map(v=>({v, notas:this.parsear(v.n), i:0, t:t0}));
    const tick = ()=>{ if(this.voces!==voces) return; const ahora = this.ctx.currentTime, fin = ahora+.25;
      voces.forEach(s=>{ while(s.t<ahora){ s.t += s.notas[s.i].d*seg; s.i = (s.i+1)%s.notas.length; }     // si la pestaña estuvo oculta, se salta lo atrasado
        while(s.t<fin){ const n = s.notas[s.i]; this.nota(s.t, n.f, n.d*seg, s.v.tipo, s.v.vol); s.t += n.d*seg; s.i = (s.i+1)%s.notas.length; } }); };
    tick(); this.timer = setInterval(tick, 60);
  },
  // ---------- Lo-fi hip hop ----------
  lofiIniciar(nom){
    const P = LOFI[nom], c = this.ctx, paso = 60/P.tempo/4, total = 16*P.prog.length;
    this.filtro.frequency.setValueAtTime(P.filtro, c.currentTime);
    const cr = c.createBufferSource(), hp = c.createBiquadFilter(), g = c.createGain();          // soplido de vinilo de fondo
    cr.buffer = this.ruido; cr.loop = true; hp.type = 'highpass'; hp.frequency.value = 3000; g.gain.value = .009; cr.connect(hp); hp.connect(g); g.connect(this.bus.musica); cr.start();
    const L = this.lofi = {P, paso, s:0, t:c.currentTime+.08, crujido:cr};
    const tick = ()=>{ if(this.lofi!==L) return; const ahora = c.currentTime, fin = ahora+.3;
      while(L.t<ahora){ L.s = (L.s+1) % total; L.t += paso; }
      while(L.t<fin){ this.lofiPaso(L, L.s, L.t); L.s = (L.s+1) % total; L.t += paso; } };
    tick(); this.timer = setInterval(tick, 60);
  },
  lofiPaso(L, s, t){
    const P = L.P, st = s%16, cp = Math.floor(s/16), atraso = st%2 ? P.swing : st%4===2 ? P.swing*.6 : 0, tt = t + atraso*L.paso + (Math.random()-.5)*.008;
    if(P.kick[st]==='x') this.bombo(tt);
    if(P.snare[st]==='x') this.caja(tt);
    if(P.hat[st]==='x' || P.hat[st]==='o') this.platillo(tt, P.hat[st]==='o', (st%4===0 ? 1 : .55) * (.8+Math.random()*.3));
    if(st===0) P.prog[cp].forEach((n,k)=>this.rhodes(tt + k*.014, this.frec(n), L.paso*15, .04));
    if(P.comp && st===10) P.prog[cp].slice(1).forEach(n=>this.rhodes(tt, this.frec(n), L.paso*5, .018));
    if(st===0) this.bajo(tt, this.frec(P.bajo[cp]), L.paso*7, 1);
    if(st===10) this.bajo(tt, this.frec(P.bajo[cp])*1.5, L.paso*3, .6);
    ((P.mel||[])[cp]||[]).forEach(([s0,n,d])=>{ if(s0===st) this.rhodes(tt, this.frec(n), L.paso*d*1.6, .05, true); });
    if(Math.random()<.06) this.chasquido(t + Math.random()*L.paso);
  },
  // Piano eléctrico: seno + triángulo (o seno a la octava, si suena como campana), ataque suave y cola larga
  rhodes(t, f, dur, vol, campana){
    const c = this.ctx, o1 = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain(), g2 = c.createGain();
    o1.type = 'sine'; o2.type = campana ? 'sine' : 'triangle'; o1.frequency.value = f; o2.frequency.value = campana ? f*2 : f; o2.detune.value = 7; g2.gain.value = campana ? .22 : .32;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.012); g.gain.exponentialRampToValueAtTime(vol*.4, t+.3); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(this.bus.lofi); o1.start(t); o2.start(t); o1.stop(t+dur+.05); o2.stop(t+dur+.05);
  },
  bajo(t, f, dur, v){
    const c = this.ctx, o = c.createOscillator(), g = c.createGain(); o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.2*v, t+.02); g.gain.setValueAtTime(.2*v, t+dur*.6); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    o.connect(g); g.connect(this.bus.lofi); o.start(t); o.stop(t+dur+.05);
  },
  bombo(t){ const c = this.ctx, o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(42, t+.12);
    g.gain.setValueAtTime(.38, t); g.gain.exponentialRampToValueAtTime(.0001, t+.38); o.connect(g); g.connect(this.bus.lofi); o.start(t); o.stop(t+.4); },
  caja(t){ const c = this.ctx, n = c.createBufferSource(), bp = c.createBiquadFilter(), g = c.createGain(); n.buffer = this.ruido; bp.type = 'bandpass'; bp.frequency.value = 1700; bp.Q.value = .8;
    g.gain.setValueAtTime(.14, t); g.gain.exponentialRampToValueAtTime(.0001, t+.22); n.connect(bp); bp.connect(g); g.connect(this.bus.musica); n.start(t, Math.random()*.5); n.stop(t+.25);
    const o = c.createOscillator(), g2 = c.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(190, t); o.frequency.exponentialRampToValueAtTime(140, t+.08);
    g2.gain.setValueAtTime(.08, t); g2.gain.exponentialRampToValueAtTime(.0001, t+.12); o.connect(g2); g2.connect(this.bus.lofi); o.start(t); o.stop(t+.14); },
  platillo(t, abierto, v){ const c = this.ctx, n = c.createBufferSource(), hp = c.createBiquadFilter(), lp = c.createBiquadFilter(), g = c.createGain(); n.buffer = this.ruido;
    hp.type = 'highpass'; hp.frequency.value = 6000; lp.type = 'lowpass'; lp.frequency.value = 8000; const d = abierto ? .18 : .045;
    g.gain.setValueAtTime(.03*v, t); g.gain.exponentialRampToValueAtTime(.0001, t+d); n.connect(hp); hp.connect(lp); lp.connect(g); g.connect(this.bus.musica); n.start(t, Math.random()*.5); n.stop(t+d+.02); },
  chasquido(t){ const c = this.ctx, n = c.createBufferSource(), g = c.createGain(); n.buffer = this.ruido; g.gain.setValueAtTime(.04, t); g.gain.exponentialRampToValueAtTime(.0001, t+.006);

  // ---------- Jingles y efectos ----------
  jingle(nom, despues){
    const J = JINGLES[nom], prev = this.contexto; this.parar();

    const seg = 60/J.tempo/4, lofi = this.estilo==='lofi'; let t = this.ctx.currentTime+.05;

  },
  sfx(tipo){

      golpe:['sawtooth',220,60,.07,.18], acierto:['square',523,1046,.06,.22], fallo:['triangle',260,120,.08,.25], curar:['triangle',440,880,.07,.3],
      alerta:['square',988,740,.05,.2], puerta:['triangle',196,392,.06,.25]}[tipo] || ['square',440,440,.04,.05];
    o.type = cfg[0]; o.frequency.setValueAtTime(cfg[1], t); o.frequency.exponentialRampToValueAtTime(cfg[2], t+cfg[4]);
    g.gain.setValueAtTime(cfg[3], t); g.gain.exponentialRampToValueAtTime(.0005, t+cfg[4]); o.start(t); o.stop(t+cfg[4]+.02);
  }
};

// ---------- Escala: el juego ocupa toda la ventana. Alto fijo de 192 px del juego; el ancho (ANCHO) va de 320 a 384 según la forma
// de la pantalla, para que en pantallas anchas se vea más oficina en vez de franjas negras. --u = píxeles de pantalla por píxel del juego ----------
let ANCHO = 320;
const ALTO = 192;
function pantallaCompleta(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function ajustar(){
  const pc = pantallaCompleta(), margen = pc ? 0 : 16, tactil = document.body.classList.contains('tactil') ? ($('tactil').offsetHeight || 164) + 10 : 0;
  // clientWidth/clientHeight y no innerWidth: en celulares innerWidth crece si algo se desborda y el cálculo se realimentaría
  const de = document.documentElement, W = Math.max(280, de.clientWidth-margen), H = Math.max(168, de.clientHeight-margen-tactil);
  const ancho = Math.max(320, Math.min(384, Math.round(ALTO*W/H/2)*2));
  if(ancho!==ANCHO || cv.width!==ancho){ ANCHO = ancho; cv.width = ancho; cv.height = ALTO; ctx.imageSmoothingEnabled = false; }
  const s = Math.min(W/ANCHO, H/ALTO), j = $('juego');
  j.style.width = Math.floor(ANCHO*s)+'px'; j.style.height = Math.floor(ALTO*s)+'px'; j.style.setProperty('--u', s+'px');
  $('tactil').style.width = Math.floor(ANCHO*s)+'px';
  document.body.classList.toggle('pc', pc);
}
function alternarPantallaCompleta(){
  const d = document, el = d.documentElement, aviso = 'El navegador no permitió la pantalla completa' + (document.body.classList.contains('tactil') ? '' : ': prueba con F11');
  try{
    if(pantallaCompleta()){ (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
    const p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    if(p && p.catch) p.catch(()=>toast(aviso));
  }catch(e){ toast(aviso); }
}

// Lista navegable con teclado y ratón. items: {t, sub, dis, f, tag}
function lista(items, {cols=1, cancel=null, alMover=null, inicial=0, decision=false}={}){
  const el = div('lista'); el.style.gridTemplateColumns = `repeat(${cols},1fr)`;
  const voto = decision && AJ.facilitador;
  let sel = Math.min(inicial, items.length-1);
  const botones = items.map((it,k)=>{ const b = document.createElement('button'); b.className = 'op'; b.type = 'button';
    b.innerHTML = (voto ? `<b class="letra">${'ABCDEFGH'[k]}</b> ` : '') + esc(it.t) + (it.tag||'') + (it.sub ? `<small>${esc(it.sub)}</small>` : ''); if(it.dis) b.disabled = true;
    b.onmouseenter = ()=>{ if(!it.dis){ sel = k; pintar(); } }; b.onclick = ()=>{ if(!it.dis){ sel = k; elegir(); } }; el.appendChild(b); return b; });
  const pintar = ()=>{ botones.forEach((b,k)=>b.classList.toggle('sel', k===sel)); if(botones[sel] && botones[sel].isConnected) botones[sel].scrollIntoView({block:'nearest'}); if(alMover) alMover(items[sel], sel); };
  const mover = d=>{ let n = sel; for(let i=0;i<items.length;i++){ n = (n+d+items.length)%items.length; if(!items[n].dis) break; } if(n!==sel){ sel = n; Sonido.sfx('blip'); pintar(); } };
  const elegir = ()=>{ const it = items[sel]; if(!it || it.dis) { Sonido.sfx('no'); return; } Sonido.sfx('ok'); it.f && it.f(it, sel); };
  if(items[sel] && items[sel].dis) mover(1);
  pintar(); if(voto) cronometro(el);
  return {el, onKey(k){
    if(k==='arriba') mover(-cols); else if(k==='abajo') mover(cols); else if(k==='izquierda' && cols>1) mover(-1); else if(k==='derecha' && cols>1) mover(1);
    else if(k==='A') elegir(); else if(k==='B' && cancel){ Sonido.sfx('no'); cancel(); } }};
}

  const j = G.jug; if(!j || j.mov) return; const [fx,fy] = frente();

/* =====================================================================
   7. COMBATE POR TURNOS — del riesgo inherente al residual, hasta llevarlo al apetito
   Cada control baja la probabilidad (preventivo) o el impacto (detectivo, correctivo) del riesgo residual.

const XP_NIVEL = [0, 50, 120, 210, 320, 450, 600, 800, 1000, 1250, 1500, 1800];

  const C = G.combate; if(!C) return; const r = C.r, nv = NIVELES[nivelR(r)], res = NIVELES[nivelDe(C.rp, C.ri)];

function evaluar(){
  const C = G.combate, r = C.r;
  if(C.eval>=2){ msgs(['Ya evaluaste este riesgo: conoces su nivel inherente, su residual y su mejor respuesta.'], menuPrincipal); return; }
  if(!tiene('matriz')){
    if(!r.identificar){ msgs(['Necesitas la Matriz de calor para evaluar este riesgo.'], menuPrincipal); return; }
    const q = r.identificar;
    const capa = panel('Identificar el riesgo', `<p>${esc(r.escena)}</p><p><b>${esc(q.preg)}</b></p>`, q.ops.map((o,k)=>({t:o, f:()=>{ UI.cerrar(capa);
      if(k===q.ok){ dec(true,'ccc'); C.eval = 2; C.conoce = C.debil = true; Sonido.sfx('acierto'); C.fx = {tipo:'evaluar', t:0};
        msgs(['¡Bien identificado!', q.exp, `Ahora conoces su nivel: ${NIVELES[nivelR(r)].n}, y su mejor respuesta. El apetito de Aurora llega hasta ${NIVELES[APETITO].n}.`], ()=>{ fichas(); turnoEnemigo(); }); }
      else { dec(false,'ccc'); Sonido.sfx('fallo'); msgs(['No exactamente.', q.exp], turnoEnemigo); } }})), {ancho:'78%', decision:true});
    return;
  }
  minijuegoMatriz(r, res=>{
    const nv = NIVELES[nivelR(r)].n; C.fx = {tipo:'evaluar', t:0};
    if(res==='exacto'){ dec(true,'matriz'); E.stats.exactas++; if(E.stats.exactas>=10) logro('evaluador');
      C.eval = 2; C.conoce = C.debil = true; Sonido.sfx('acierto');
      msgs([`¡Exacto! Probabilidad ${r.p} e impacto ${r.i}: nivel inherente ${nv}.`, `Mejor respuesta: ${RESPUESTAS[r.debil].n}. Llévalo hasta ${NIVELES[APETITO].n} o menos y podrás aceptarlo.`], ()=>{ fichas(); turnoEnemigo(); }); }
    else if(res==='cerca'){ dec(false,'matriz'); C.eval = Math.max(C.eval, 1); C.conoce = true; Sonido.sfx('ok');
      msgs([`Casi. Era probabilidad ${r.p} e impacto ${r.i}: nivel ${nv}.`, 'Ya conoces el nivel, pero no la mejor respuesta.'], ()=>{ fichas(); turnoEnemigo(); }); }
    else { dec(false,'matriz'); Sonido.sfx('fallo'); msgs(['Esa ubicación no coincide con las pistas.', 'Cuando las opiniones no coinciden, pesan más los datos: registros, historia y cifras.'], turnoEnemigo); }
  });
}
function minijuegoMatriz(r, fin){
  let p = 3, i = 3;
  const el = div('caja panel'); el.style.width = '94%';
  const pintar = ()=>{
    let m = '<div class="matriz"><div class="h">Prob. \\ Imp.</div>' + [1,2,3,4,5].map(x=>`<div class="h">${x}</div>`).join('');
    for(let y=5;y>=1;y--){ m += `<div class="h">${ESC_P[y-1][0]}</div>`;
      for(let x=1;x<=5;x++){ const k = nivelDe(y,x); m += `<div class="cel n${k} ${y===p&&x===i?'sel':''}" data-p="${y}" data-i="${x}" style="background:${NIVELES[k].c}"><span class="sim">${NIVELES[k].s}</span></div>`; } }
    m += '</div>';
    el.innerHTML = `<h2>Evaluar: ${esc(r.nombre)}</h2><p style="font-size:.75em">${esc(r.escena)}</p>
      <div class="mjm">${m}<div class="escalas"><p><b>Probabilidad:</b> ${esc(r.pistaP)}</p><p><b>Impacto:</b> ${esc(r.pistaI)}</p>
      ${habil('causa') ? `<p><b>Análisis de causa raíz:</b> la probabilidad es ${r.p}.</p>` : ''}
      <p><b>Probabilidad</b><br>${ESC_P.map(e=>e[0]+': '+e[1]).join('<br>')}</p><p><b>Impacto</b><br>${ESC_I.map(e=>e[0]+': '+e[1]).join('<br>')}</p>
      <p>Selección: <b>P${p} · I${i}</b></p></div></div><div class="ayuda">Flechas: mover · A: confirmar · B: volver sin evaluar</div>`;
    el.querySelectorAll('.cel').forEach(c=>c.onclick = ()=>{ p = +c.dataset.p; i = +c.dataset.i; pintar(); confirmar(); });
  };
  const confirmar = ()=>{ UI.cerrar(capa); const d = Math.abs(p-r.p)+Math.abs(i-r.i); fin(d===0 ? 'exacto' : d===1 ? 'cerca' : 'lejos'); };
  const capa = UI.abrir(el, k=>{
    if(k==='arriba') p = Math.min(5,p+1); else if(k==='abajo') p = Math.max(1,p-1); else if(k==='derecha') i = Math.min(5,i+1); else if(k==='izquierda') i = Math.max(1,i-1);
    else if(k==='A'){ Sonido.sfx('ok'); confirmar(); return; } else if(k==='B'){ UI.cerrar(capa); menuPrincipal(); return; }
    Sonido.sfx('blip'); pintar(); });
  pintar(); if(AJ.facilitador) cronometro(el);
}

// ---------- Responder: cada respuesta baja la probabilidad o el impacto residual ----------
function niveles(base){
  const C = G.combate; let n = base;
  if(n===2 && !C.eval) n = 1;                 // sin evaluarlo, un control fuerte rinde menos
  if(C.r.niebla && !C.eval) n = 0;             // jefe con niebla: sin evaluar no hay efecto
  if(n>0 && C.bonus){ n += C.bonus; C.bonus = 0; }
  return n;
}
function reducir(dim, n){ const C = G.combate; if(n<=0) return 0; if(dim==='P') C.rp = Math.max(1, C.rp-n); else C.ri = Math.max(1, C.ri-n); return n; }
function trasRespuesta(L, fx){
  const C = G.combate, nv = NIVELES[nivelDe(C.rp,C.ri)].n; C.fx = fx ? {tipo:fx, t:0} : null; C.anim.golpe = 1;
  if(C.conoce) L.push(`Riesgo residual: P${C.rp} · I${C.ri} → ${nv}.`); else L.push('El riesgo bajó, pero sin evaluarlo no sabes cuánto.');
  if(dentro(C)){ C.sugerirAceptar = C.conoce; L.push(C.conoce ? '¡El residual ya está dentro del apetito! Ahora puedes ACEPTARLO y monitorearlo.' : 'Parece más controlado. Si lo evalúas sabrás si ya entra en el apetito.'); }
  fichas(); msgs(L, ()=>turnoEnemigo());
}
const RESOLVER = {
  mitigar(){
    const C = G.combate, r = C.r;
    const items = r.controles.map((c,k)=>{ const ya = C.aplicados.includes(k), costo = costoControl(c), t = TIPO_CONTROL[c.tipo];
      return {t:`${c.t} (${costo})`, sub: ya ? 'Ya implementado' : tiene('controles') ? `Baja ${t[2]==='P' ? 'la probabilidad' : 'el impacto'}` : '',
        tag: tiene('controles') ? `<span class="tag ${t[1]}">${t[0]}</span>` : '', dis: ya || E.pres<costo, f:()=>usar(c,k)}; });
    $('cMsg').textContent = tiene('controles') ? 'Elige el control. Preventivo baja la probabilidad; detectivo y correctivo bajan el impacto.' : 'Elige el control que vas a implementar.';
    menuOpciones(items, 1, menuResponder, 0, true);
    function usar(c, k){
      const libres = r.controles.filter((x,j)=>!C.aplicados.includes(j)), mejor = Math.max(...libres.map(x=>x.ef)), yaDentro = dentro(C);
      C.aplicados.push(k); E.pres -= costoControl(c);
      const L = [`Implementas: «${c.t}».`, c.exp]; let ok = false;
      if(yaDentro){ L.push('El riesgo ya estaba dentro del apetito: este gasto no era necesario.'); }
      else if(r.debil==='mitigar'){ const d = TIPO_CONTROL[c.tipo][2], n = c.ef===3 ? 2 : c.ef===2 ? 1 : 0, p = d==='P' ? Math.max(1,C.rp-n) : C.rp, i = d==='I' ? Math.max(1,C.ri-n) : C.ri;
        ok = c.ef===mejor || (c.ef>=2 && nivelDe(p,i)<=APETITO); if(ok && c.ef<mejor) L.push('Decisión eficiente: con este control alcanza para entrar en el apetito y cuesta menos.'); }
      else if(r.debil==='transferir'){ if(r.combo && !C.mitigado && c.ef===3){ C.mitigado = true; ok = true; L.push('Bien: con la prevención lista, ahora el seguro sí puede hacer su parte.'); }
        else L.push('Ayuda, pero aquí transferir es más eficiente.'); }
      else if(r.debil==='aceptar') L.push('Gastaste presupuesto en un riesgo que está dentro del apetito.');
      else L.push('Le pusiste límites, pero sigue fuera del apetito y no es esencial para el negocio.');
      if(c.ef===1) C.malas.push(`elegiste «${c.t}»: ${c.exp}`);
      if(r.oportunidad && c.ef===3 && c.tipo==='preventivo' && !C.oportunidad){ C.oportunidad = true; L.push('¡Además conviertes el riesgo en una oportunidad: hay clientes nuevos que buscan ese producto!'); logro('oportunidad'); }
      dec(ok, 'controles'); Sonido.sfx(ok ? 'acierto' : 'golpe');
      reducir(TIPO_CONTROL[c.tipo][2], niveles(c.ef===3 ? 2 : c.ef===2 ? 1 : 0));
      trasRespuesta(L, 'mitigar');
    }
  },
  transferir(){
    const C = G.combate, r = C.r, concepto = (r.conceptos||[]).includes('contractual') ? 'contractual' : 'transferencia';
    if(r.noTransf){ dec(false, concepto); msgs([r.noTransf], menuPrincipal); return; }
    $('cMsg').textContent = `Elige la póliza o el contrato. Prima: ${prima()}.`;
    menuOpciones(r.transf.map(o=>({t:o.t, dis:C.polizas.includes(o.t), sub:C.polizas.includes(o.t) ? 'Ya contratada' : '', f:()=>usar(o)})), 1, menuResponder, 0, true);
    function usar(o){
      E.pres -= prima(); C.polizas.push(o.t); const L = [`Contratas: «${o.t}».`]; let ok = false, n = 0;
      if(!o.ok){ L.push(o.exp || 'Esa cobertura no cubre este tipo de pérdida: el riesgo sigue intacto.'); C.malas.push(`contrataste «${o.t}», que no cubre este riesgo`); Sonido.sfx('fallo'); }
      else if(r.debil==='transferir'){
        if(r.combo && !C.mitigado){ n = 1; L.push('La aseguradora acepta, pero sin prevención exige un deducible enorme. Falta mitigar primero.'); }
        else { n = niveles(2); ok = true; L.push('¡Cobertura correcta! El impacto financiero pasa a un tercero.'); }
      } else { n = niveles(1); L.push('Cubre parte de la pérdida, pero no evita que el evento ocurra. Falta atacar la causa.'); }
      dec(ok, concepto); reducir('I', n); trasRespuesta(L, 'transferir');
    }
  },
  aceptar(){
    const C = G.combate, r = C.r;
    if(dentro(C)){ dec(true, 'apetito'); Sonido.sfx('acierto'); C.fx = {tipo:'aceptar', t:0};
      msgs(['Decides aceptar el riesgo.', r.debil==='aceptar' && C.rp===r.p && C.ri===r.i ? r.acepta : `El residual (${NIVELES[nivelDe(C.rp,C.ri)].n}) está dentro del apetito: lo registras, le asignas un KRI de seguimiento y lo monitoreas.`], ganar); }
    else { dec(false, 'apetito'); C.malas.push(`aceptaste el riesgo cuando aún estaba en nivel ${NIVELES[nivelDe(C.rp,C.ri)].n}`); Sonido.sfx('fallo');
      msgs(['Decides aceptar el riesgo.', r.acepta, `El residual sigue en ${C.conoce ? NIVELES[nivelDe(C.rp,C.ri)].n : 'un nivel desconocido'}: fuera del apetito.`], ()=>turnoEnemigo(1.5)); }
  },
  evitar(){
    const C = G.combate, r = C.r; E.pres -= costoEvitar(r);
    if(r.debil==='evitar'){ dec(true, 'respuestas'); Sonido.sfx('acierto'); C.rp = 1; C.ri = 1; C.fx = {tipo:'evitar', t:0}; fichas(); msgs(['Decides evitar el riesgo.', r.evita], ganar); }
    else { dec(false, 'respuestas'); C.malas.push('intentaste evitar una actividad esencial para el negocio'); Sonido.sfx('fallo');
      msgs(['Decides evitar el riesgo.', r.evita, 'Gastaste presupuesto y el riesgo sigue ahí.'], turnoEnemigo); }
  }
};

    {t:'Revisar KRI', sub: !tiene('kri') ? 'Se habilita en el piso 4' : !r.kri ? 'Este riesgo no tiene KRI' : 'Anticipa el próximo golpe', dis:!tiene('kri') || !r.kri, f:revisarKRI},
    {t:'Asignar dueño', sub: !tiene('registro') ? 'Se habilita en el piso 6' : !r.dueno ? 'No aplica a este riesgo' : C.dueno ? 'Ya tiene dueño' : 'El riesgo se materializa menos', dis:!tiene('registro') || !r.dueno || C.dueno, f:asignarDueno},

    {t:`Café de la oficina (${E.cafes})`, sub:'+25 de reputación', dis:E.cafes<=0 || E.rep>=E.repMax, f:()=>{ E.cafes--; E.rep = Math.min(E.repMax, E.rep+25); Sonido.sfx('curar'); fichas(); msgs(['Un café bien cargado. Recuperas 25 de reputación.'], turnoEnemigo); }},
    {t:'Pedir presupuesto al comité', sub:`+${AYUDA_COMITE} de presupuesto, −${CASTIGO_COMITE} de reputación`, f:()=>{ E.pres += AYUDA_COMITE; E.rep -= CASTIGO_COMITE; E.stats.solicitudes++; Sonido.sfx('ok'); fichas();
      msgs([`El comité aprueba ${AYUDA_COMITE} más de presupuesto, pero queda registrado: pierdes ${CASTIGO_COMITE} de reputación.`, 'Priorizar bien desde el principio evita estas solicitudes.'], ()=>{ if(E.rep<=0) perder(); else turnoEnemigo(); }); }}];
  $('cMsg').textContent = 'Herramientas disponibles.';

}
function zonaKRI(k){ return k.mayorMalo ? (k.v < k.verde ? 0 : k.v <= k.rojo ? 1 : 2) : (k.v >= k.verde ? 0 : k.v >= k.rojo ? 1 : 2); }
function reglaKRI(k){
  const lo = k.mayorMalo ? 0 : Math.min(k.v, k.rojo)*0.97, hi = k.mayorMalo ? Math.max(k.v, k.rojo)*1.3 : 100;
  const pos = v => Math.max(0, Math.min(100, (v-lo)/(hi-lo)*100));
  const seg = k.mayorMalo ? [[lo,k.verde,'#2f9e44','V'],[k.verde,k.rojo,'#e0a800','A'],[k.rojo,hi,'#c53532','R']] : [[lo,k.rojo,'#c53532','R'],[k.rojo,k.verde,'#e0a800','A'],[k.verde,hi,'#2f9e44','V']];
  return `<div class="kri"><div class="regla">${seg.map(([a,b,c,s])=>`<span style="flex:${Math.max(.01,b-a)};background:${c}"><em class="sim">${s}</em></span>`).join('')}<i class="aguja" style="left:${pos(k.v)}%"></i></div>
    <div class="fila" style="font-size:.75em"><span>${k.mayorMalo ? 'Verde: menos de '+k.verde+k.u : 'Rojo: menos de '+k.rojo+k.u}</span><span>${k.mayorMalo ? 'Rojo: más de '+k.rojo+k.u : 'Verde: '+k.verde+k.u+' o más'}</span></div></div>`;
}
function revisarKRI(){
  const C = G.combate, k = C.r.kri, z = zonaKRI(k);
  const ops = ['Nada: está dentro de lo normal','Alertar al dueño del riesgo y vigilar','Escalar y activar el plan de respuesta'];
  const capa = panel('Tablero de KRI', `<p><b>${esc(k.n)}</b>: <b style="color:var(--oro)">${k.v}${k.u}</b></p>${reglaKRI(k)}<p>¿Qué haces con esta lectura?</p>`,
    ops.map((o,i)=>({t:o, f:()=>{ UI.cerrar(capa); C.fx = {tipo:'kri', t:0};
      if(i===z){ dec(true,'kri'); C.alerta = true; Sonido.sfx('acierto');
        const L = [['El indicador está en verde: no hace falta actuar.','En amarillo se alerta al dueño del riesgo y se vigila de cerca.','En rojo se escala y se activa el plan de respuesta.'][z],
          'Te adelantas al riesgo: su próximo golpe no logrará materializarse.'];
        if(C.cargando){ C.cargando = false; L.push('La presión que acumulaba se disipa.'); }
        fichas(); msgs(L, turnoEnemigo); }
      else { dec(false,'kri'); Sonido.sfx('fallo'); msgs([`La lectura está en ${['verde','amarillo','rojo'][z]}: lo indicado era «${ops[z]}».`, 'Un KRI sirve si cada umbral tiene una acción definida de antemano.'], turnoEnemigo); } }})), {ancho:'80%', decision:true});
}
function asignarDueno(){
  const C = G.combate, d = C.r.dueno;

    if(i===d.ok){ dec(true,'dueno'); C.dueno = true; C.vigilancia = .15; Sonido.sfx('acierto');

// ---------- Gonzalo ----------
function consultarGonzalo(){
  const C = G.combate, r = C.r; C.consultas--; E.stats.consultas++; E.consultasPiso[E.piso] = (E.consultasPiso[E.piso]||0)+1; C.conoce = C.debil = true; fichas();
  const nv = NIVELES[nivelR(r)].n, rn = NIVELES[nivelDe(C.rp,C.ri)].n;
  decir([{q:'gonzalo', e:'pensativo', t:r.gonzalo}, {q:'gonzalo', e:'pensativo', t:`Mis datos: inherente P${r.p}·I${r.i} (${nv}); hoy el residual está en P${C.rp}·I${C.ri} (${rn}). Mejor respuesta: ${RESPUESTAS[r.debil].n}.${C.consultas ? '' : ' Es mi último dato en este combate, ¡tú puedes!'}`}], menuPrincipal);
}
// ---------- Turno del riesgo: la probabilidad residual decide si golpea y el impacto residual cuánto ----------
function turnoEnemigo(fuerza=1){
  const C = G.combate; if(!C) return; const r = C.r; C.turno++;
  if(C.alerta){ C.alerta = false; msgs(['Gracias a la alerta temprana, el riesgo no logra materializarse este turno.'], menuPrincipal); return; }
  let mult = fuerza;
  if(r.carga){
    if(C.cargando){ C.cargando = false; mult *= 2; }
    else if(C.turno % 3 === 0){ C.cargando = true; fichas(); Sonido.sfx('alerta'); msgs([`${r.nombre} está acumulando presión… El próximo golpe será el doble de fuerte.`, tiene('kri') && r.kri ? 'Revisar el KRI te permitiría anticiparlo.' : 'Prepárate.'], menuPrincipal); return; }
  }
  const chance = .2 + C.rp*.12 - C.vigilancia;
  if(Math.random() > chance && mult<2){ msgs([C.rp<r.p ? 'El control funcionó: esta vez el riesgo no se materializó.' : 'Esta vez el riesgo no se materializó.'], menuPrincipal); return; }
  const d = Math.max(1, Math.round(rnd(r.dano[0], r.dano[1]) * C.ri / r.i * mult));
  E.rep -= d; C.anim.temblor = 1; C.fx = {tipo:'golpe', t:0}; Sonido.sfx('golpe');
  const L = [r.ataque, `Pierdes ${d} de reputación.`];
  if(C.ri<r.i) L.push('El golpe es menor porque ya bajaste el impacto.');
  if(r.golpePres && E.pres>0){ const p = Math.min(E.pres, Math.ceil(d/3)); E.pres -= p; L.push(`Y ${p} de presupuesto.`); }
  fichas(); msgs(L, ()=>{ if(E.rep<=0) perder(); else menuPrincipal(); });
}
// ---------- Final del combate ----------
function ganar(){
  const C = G.combate, r = C.r; Sonido.jingle('victoria', ()=>{});
  const L = [`¡${r.nombre} quedó gestionado!`]; let subio = false; const antes = E.nivel;
  const xp = (r.xp||0) + (C.oportunidad ? 30 : 0);
  if(xp){ E.xp += xp; L.push(`Ganas ${xp} de experiencia.`);
    while(E.nivel < XP_NIVEL.length-1 && E.xp >= XP_NIVEL[E.nivel]){ E.nivel++; E.repMax += 10; E.rep = E.repMax; subio = true; }
    if(subio) L.push(`¡Subes a nivel ${E.nivel}! Más reputación máxima.`);
    HABILIDADES.filter(h=>h.nivel>antes && h.nivel<=E.nivel).forEach(h=>L.push(`Nueva habilidad: ${h.n}. ${h.d}`)); }
  if(!E.vencidos.includes(C.id)) E.vencidos.push(C.id);
  if(r.oculto && !E.revelados.includes(C.id)) E.revelados.push(C.id);
  logro('primer_paso'); if(r.oculto){ logro('ojo'); if(['derrame','postit','alcance'].every(id=>E.vencidos.includes(id))) logro('cazador'); }
  if(r.jefe && C.incorrectas===0) logro('perfecto');
  if(C.malas.length && !E.incidentes.some(x=>x.id===C.id)) E.incidentes.push({id:C.id, nota:C.malas[0], piso:E.piso, visto:false});
  const nuevos = (r.conceptos||[]).filter(aprender);
  msgs(L, ()=>{

  if(!pend.length){ fin(); return; }

    if(k>=pend.length){ guardar(); fin(); return; }

    const mejor = r.debil==='mitigar' ? r.controles.find(c=>c.ef===3).t : r.debil==='transferir' ? r.transf.find(o=>o.ok).t : r.debil==='aceptar' ? 'Aceptarlo y monitorearlo: estaba dentro del apetito' : 'Evitar la actividad: estaba fuera del apetito';
    const debil = (r.controles.find(c=>c.ef===1)||{}).t || 'Esperar a ver si vuelve a pasar';
    const ops = [mejor, debil, 'Esperar a ver si vuelve a pasar'].filter((x,i,a)=>a.indexOf(x)===i), rot = inc.id.length % ops.length, orden = ops.slice(rot).concat(ops.slice(0,rot));

  {p:'¿Cuál es el rol de auditoría interna?', ops:['Diseñar y operar los controles','Dar aseguramiento independiente al directorio','Vender seguros a la empresa'], ok:1, exp:'Auditoría no gestiona los riesgos: revisa de forma independiente si la gestión funciona e informa al directorio.'}

function hablarAuditor(){
  const L = t => ({q:'martin', t});
  if(E.flags.auditoria){ decir([L('Tu trabajo quedó bien documentado. Nos vemos en la próxima auditoría.')]); return; }
  decir([L('Martín Ochoa, auditoría interna. No vengo a gestionar riesgos: vengo a revisar si su gestión funciona.'),
    L(E.stats.incidentes ? `Veo ${E.stats.incidentes} ${E.stats.incidentes===1 ? 'incidente' : 'incidentes'} en el registro. Revisemos cómo trabajan las líneas de defensa.` : 'Tu registro no tiene incidentes. Igual, revisemos cómo trabajan las líneas de defensa.')],
    ()=>quiz('Revisión de auditoría', PREGUNTAS_AUDITORIA, {concepto:'lineas', alTerminar:(bien, total)=>{
      E.flags.auditoria = true; aprender('lineas'); aprender('incidente'); E.xp += 15*bien; subirNivel(); if(bien===total) logro('auditado'); guardar();
      decir([L(bien===total ? 'Revisión limpia. Así da gusto auditar.' : `Acertaste ${bien} de ${total}. Te dejo mis observaciones en el glosario.`)]); }}));
}

const INTERLUDIO = ['Los sistemas vuelven a operar sin pagar el rescate. Bien. Ahora, el proveedor de mineral.',
  'Ya hay segundo proveedor e inventario de seguridad. Queda lo más difícil: la reputación.'];
function hablarElena(){
  const L = t => ({q:'elena', t});
  if(E.flags.fin){ decir([L('Gracias por todo, {N}. La empresa está mejor preparada gracias a ti.')], ()=>pantallaFinal()); return; }
  const f = E.flags.fase || 0;
  if(f>=3){ informe(); return; }
  if(f>0){ decir([L('Retomemos donde quedamos.')], ()=>fase(f)); return; }
  decir([L('Bienvenido, {N}. Gonzalo me habló muy bien de ti.'),
    L('Tenemos una situación: en las últimas horas se juntaron tres crisis. Un ataque de ransomware, un proveedor que suspende envíos y un rumor que se volvió viral.'),
    {q:'elena', t:'Necesito que las gestiones una por una y luego me presentes el informe. ¿Empezamos?', elige:[{t:'Sí, empecemos', f:()=>{ Dlg.cola = []; Dlg.fin = ()=>fase(0); }},{t:'Dame un momento', f:()=>{ Dlg.cola = []; }}]}]);
}
function fase(k){
  iniciarCombate(FASES_FINAL[k], {
    alGanar:()=>{ E.flags.fase = k+1; guardar(); if(k<2) decir([{q:'elena', t:INTERLUDIO[k]}], ()=>fase(k+1)); else informe(); },
    alPerder:()=>decir([{q:'elena', t:'Tómate un respiro. Habla conmigo cuando estés listo para retomar.'}])});
}
const PREGUNTAS_INFORME = [
  {p:'Tienes tres riesgos para el informe. ¿Con cuál abres la presentación?', ops:['El ransomware: Extremo y con el KRI de parches en rojo','La Moneda Suelta: Bajo y dentro del apetito','El Engranajón: ya tratado, con residual Moderado'], ok:0,
    exp:'Se presenta primero lo de mayor nivel y peor tendencia: el directorio debe ver lo que puede afectar la estrategia.'},
  {p:'¿Qué debe incluir cada riesgo en el informe?', ops:['Nivel inherente y residual, tendencia del KRI, dueño y plan de tratamiento','Solo la lista de incidentes del año','Un mapa de calor sin explicaciones'], ok:0, exp:GLOSARIO.reporte.d},
  {p:'¿Quién es el dueño del riesgo de dependencia de proveedores?', ops:['El área de riesgos','El gerente de compras y abastecimiento','La aseguradora'], ok:1, exp:GLOSARIO.dueno.d},
  {p:'¿Qué le pides al directorio al cerrar?', ops:['Aprobar el apetito de riesgo y los recursos del plan','Que gestione cada riesgo personalmente','Nada: el informe es solo para que estén enterados'], ok:0,
    exp:'El directorio fija el apetito, aprueba recursos y supervisa. La gestión diaria la hacen los dueños de cada proceso.'}

function informe(){
  decir([{q:'elena', t:'Las tres crisis están bajo control. Ahora preséntame el informe para el directorio.'}],
    ()=>quiz('Informe al directorio', PREGUNTAS_INFORME, {concepto:'reporte', voz:'elena', alTerminar:bien=>cierre(bien)}));
}
function cierre(bien){
  aprender('reporte');

// Cuestionario genérico: una pregunta por panel y, si corresponde, retroalimentación
function quiz(titulo, preguntas, {concepto=null, alTerminar=null, feedback=true, registrar=true, ancho='84%'}={}){
  let k = 0, bien = 0; const res = [];
  const sig = ()=>{
    if(k>=preguntas.length){ alTerminar && alTerminar(bien, preguntas.length, res); return; }
    const Q = preguntas[k];
    const capa = panel(`${titulo}${preguntas.length>1 ? ` · ${k+1} de ${preguntas.length}` : ''}`, `<p>${esc(Q.p)}</p>`, Q.ops.map((o,i)=>({t:o, f:()=>{
      UI.cerrar(capa); const ok = i===Q.ok; res.push(ok); if(ok) bien++;
      if(registrar) decision(ok, Q.c || concepto);
      k++;
      if(!feedback){ sig(); return; }

  else if(G.fade>0) G.fade = Math.max(0, G.fade-dt/260);

    j.mov.t += dt; const k = Math.min(1, j.mov.t/150);
    j.px = (j.mov.x0 + (j.x-j.mov.x0)*k)*TS; j.py = (j.mov.y0 + (j.y-j.mov.y0)*k)*TS; j.f = 1 + (Math.floor(j.mov.t/75)%2);

  const dt = Math.max(0, Math.min(50, ahora-ultimo)); ultimo = ahora; G.t += dt; actualizar(dt);
  ctx.setTransform(1,0,0,1,0,0); ctx.imageSmoothingEnabled = false; ctx.fillStyle = '#000'; ctx.fillRect(0,0,ANCHO,ALTO);
  if(G.modo==='combate' && G.combate) dibujarCombate();
  else if((G.modo==='mapa' || G.modo==='final') && G.jug){ const j = G.jug, M = pisoAct().mapa;
    const camX = Math.max(0, Math.min(M[0].length*TS-ANCHO, Math.round(j.px)+8-ANCHO/2)), camY = Math.max(0, Math.min(M.length*TS-ALTO, Math.round(j.py)+8-ALTO/2));
    G.cam = {x:camX, y:camY}; dibujarMapa(camX, camY);
    const sx = j.px-camX, sy = j.py-camY, h = $('hud'); h.style.opacity = (sx<ANCHO*.38 && sy<70) ? .25 : 1; }
  else dibujarFondoTitulo();
  if(G.fade>0){ ctx.fillStyle = `rgba(0,0,0,${G.fade})`; ctx.fillRect(0,0,ANCHO,ALTO); }
}
aplicarAjustes();
pantallaTitulo();
requestAnimationFrame(bucle);
